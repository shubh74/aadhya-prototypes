<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omkar Cloud – Presenter Recruitment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0EA5E9',   /* teal-500 */
            accent:  '#0284C7',   /* teal-600 */
            dark:    '#0F172A',   /* slate-900 */
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const sections = [
      { id: 'hero', label: 'Home' },
      { id: 'about', label: 'Why Omkar?' },
      { id: 'tools', label: 'Our Tools' },
      { id: 'benefits', label: 'Presenter Benefits' },
      { id: 'apply', label: 'Apply Now' },
    ];

    const Nav = ({ mobileOpen, setMobileOpen }) => (
      <nav className="sticky top-0 bg-white shadow-sm z-50">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
          <div className="flex items-center">
            <a href="#hero" className="text-2xl font-bold text-primary">Omkar Cloud</a>
          </div>
          {/* Desktop menu */}
          <div className="hidden md:flex space-x-6">
            {sections.map(s => (
              <a key={s.id} href={`#${s.id}`} className="text-gray-700 hover:text-primary transition">
                {s.label}
              </a>
            ))}
          </div>
          {/* Mobile menu button */}
          <button className="md:hidden text-gray-700 focus:outline-none" onClick={() => setMobileOpen(!mobileOpen)}>
            <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              {mobileOpen ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
              )}
            </svg>
          </button>
        </div>
        {/* Mobile menu */}
        {mobileOpen && (
          <div className="md:hidden bg-white border-t border-gray-200">
            <div className="px-2 pt-2 pb-3 space-y-1">
              {sections.map(s => (
                <a key={s.id} href={`#${s.id}`} className="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-100">
                  {s.label}
                </a>
              ))}
            </div>
          </div>
        )}
      </nav>
    );

    const Hero = () => (
      <section id="hero" className="bg-primary text-white py-20">
        <div className="max-w-4xl mx-auto text-center px-4">
          <h1 className="text-4xl md:text-5xl font-bold mb-4">Your Face. Our Data Tools. Unlimited Reach.</h1>
          <p className="text-lg md:text-xl mb-8">
            Join Omkar Cloud as a professional presenter and showcase our cutting‑edge data extraction tools to a global audience.
          </p>
          <a href="#apply" className="inline-block bg-white text-primary font-semibold py-3 px-6 rounded-full hover:bg-gray-100 transition">
            Apply Now
          </a>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-16 bg-white">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center text-dark mb-8">Why Present for Omkar Cloud?</h2>
          <div className="grid md:grid-cols-3 gap-8">
            <div className="bg-gray-50 p-6 rounded-lg shadow-sm hover:shadow-md transition">
              <h3 className="font-semibold text-primary mb-2">Trusted Brand</h3>
              <p>Rated Excellent on Trustpilot (4.7/5) and used by thousands of developers worldwide.</p>
            </div>
            <div className="bg-gray-50 p-6 rounded-lg shadow-sm hover:shadow-md transition">
              <h3 className="font-semibold text-primary mb-2">High‑Paying Gigs</h3>
              <p>Earn $1,200+ in the first two months, with recurring $250‑$300 monthly opportunities.</p>
            </div>
            <div className="bg-gray-50 p-6 rounded-lg shadow-sm hover:shadow-md transition">
              <h3 className="font-semibold text-primary mb-2">Creative Freedom</h3>
              <p>Follow a simple script, focus on performance, and let our editors handle the rest.</p>
            </div>
          </div>
        </div>
      </section>
    );

    const Tools = () => (
      <section id="tools" className="py-16 bg-gray-50">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center text-dark mb-8">Our Most Popular Tools</h2>
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            {[
              { name: 'Google Maps Extractor', price: '$120' },
              { name: 'IMDb Scraper', price: '$25' },
              { name: 'Crunchbase Explorer', price: '$50' },
              { name: 'Airbnb Data Miner', price: '$50' },
              { name: 'Reddit Thread Analyzer', price: '$50' },
              { name: 'Shein Trend Tracker', price: '$50' },
            ].map((tool, i) => (
              <div key={i} className="bg-white p-5 rounded-lg shadow hover:shadow-lg transition">
                <h3 className="font-semibold text-primary mb-2">{tool.name}</h3>
                <p className="text-gray-600 mb-3">Quick demo videos on our YouTube channel.</p>
                <span className="inline-block bg-primary text-white text-xs px-2 py-1 rounded">{tool.price} per video</span>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Benefits = () => (
      <section id="benefits" className="py-16 bg-white">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center text-dark mb-8">What You’ll Get</h2>
          <ul className="space-y-4 text-lg max-w-2xl mx-auto">
            <li>✔️ Full usage rights – your videos stay on our channel forever.</li>
            <li>✔️ Flexible schedule – record whenever you like.</li>
            <li>✔️ Professional editing – we handle post‑production.</li>
            <li>✔️ Consistent payouts – milestone payment before each shoot.</li>
            <li>✔️ Exposure to a developer audience of 10k+ monthly viewers.</li>
          </ul>
        </div>
      </section>
    );

    const ApplyForm = () => {
      const initialState = {
        videoLink: '',
        macModel: '',
        country: '',
        technical: '',
        energetic: '',
        microphone: '',
      };
      const [form, setForm] = useState(initialState);
      const [submitted, setSubmitted] = useState(false);

      const handleChange = e => {
        const { name, value } = e.target;
        setForm(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = e => {
        e.preventDefault();
        // In a real app you'd POST this data.
        setSubmitted(true);
      };

      if (submitted) {
        return (
          <div className="bg-green-100 border border-green-200 text-green-800 p-6 rounded-lg">
            <h3 className="font-semibold text-lg mb-2">Application Received!</h3>
            <p>Thank you for applying. We’ll review your details and get back within 24 hours.</p>
          </div>
        );
      }

      return (
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block font-medium mb-1">1️⃣ Video of you speaking to camera (URL)</label>
            <input type="url" name="videoLink" required value={form.videoLink} onChange={handleChange}
              className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label className="block font-medium mb-1">2️⃣ Mac model (e.g., MacBook Pro 2023)</label>
            <input type="text" name="macModel" required value={form.macModel} onChange={handleChange}
              className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label className="block font-medium mb-1">3️⃣ Country (Australia, UK, or Ireland)</label>
            <input type="text" name="country" required value={form.country} onChange={handleChange}
              className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label className="block font-medium mb-1">4️⃣ Are you technically competent? (Yes/No)</label>
            <select name="technical" required value={form.technical} onChange={handleChange}
              className="w-full border rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-primary">
              <option value="">Select</option>
              <option>Yes</option>
              <option>No</option>
            </select>
          </div>
          <div>
            <label className="block font-medium mb-1">5️⃣ Are you energetic, clear, and confident on camera? (Yes/No)</label>
            <select name="energetic" required value={form.energetic} onChange={handleChange}
              className="w-full border rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-primary">
              <option value="">Select</option>
              <option>Yes</option>
              <option>No</option>
            </select>
          </div>
          <div>
            <label className="block font-medium mb-1">6️⃣ Microphone you use (e.g., Blue Yeti)</label>
            <input type="text" name="microphone" required value={form.microphone} onChange={handleChange}
              className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
          </div>
          <button type="submit" className="bg-primary text-white font-semibold py-2 px-4 rounded hover:bg-accent transition">
            Submit Application
          </button>
        </form>
      );
    };

    const Apply = () => (
      <section id="apply" className="py-20 bg-gray-50">
        <div className="max-w-4xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center text-dark mb-8">Ready to Join?</h2>
          <p className="text-center mb-8">
            Answer the six questions below, attach a short intro video, and we’ll be in touch within a day.
          </p>
          <ApplyForm />
        </div>
      </section>
    );

    const Footer = () => (
      <footer className="bg-dark text-white py-8">
        <div className="max-w-5xl mx-auto px-4 text-center">
          <p>© {new Date().getFullYear()} Omkar Cloud – Turning data into insight.</p>
          <p className="text-sm mt-2">Prototype by <a href="https://github.com/shubh-mehta" className="underline hover:text-primary">Shubh Mehta (Dev)</a></p>
        </div>
      </footer>
    );

    const App = () => {
      const [mobileOpen, setMobileOpen] = useState(false);
      return (
        <>
          <Nav mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
          <main className="mt-4">
            <Hero />
            <About />
            <Tools />
            <Benefits />
            <Apply />
          </main>
          <Footer />
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
