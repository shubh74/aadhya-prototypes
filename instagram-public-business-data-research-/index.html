<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InstaBiz Insights – Instagram Business Data Research</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0EA5E9',   /* sky-500 */
            secondary: '#1E3A8A', /* indigo-800 */
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>
<body class="font-sans bg-gray-50 text-gray-800 antialiased">
  <div id="root"></div>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const sections = [
      { id: 'hero', label: 'Home' },
      { id: 'services', label: 'Services' },
      { id: 'process', label: 'How It Works' },
      { id: 'pricing', label: 'Pricing' },
      { id: 'contact', label: 'Contact' },
    ];

    const Navbar = () => (
      <nav className="fixed inset-x-0 top-0 bg-white shadow-md z-50">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
          <a href="#hero" className="text-2xl font-heading font-bold text-primary">InstaBiz Insights</a>
          <div className="hidden md:flex space-x-6">
            {sections.map(s => (
              <a key={s.id} href={`#${s.id}`} className="text-gray-600 hover:text-primary transition">{s.label}</a>
            ))}
          </div>
          {/* Mobile menu button */}
          <MobileMenu />
        </div>
      </nav>
    );

    const MobileMenu = () => {
      const [open, setOpen] = useState(false);
      return (
        <div className="md:hidden">
          <button onClick={() => setOpen(!open)} className="text-gray-600 focus:outline-none">
            <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              {open ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
              )}
            </svg>
          </button>
          {open && (
            <div className="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-2">
              {sections.map(s => (
                <a
                  key={s.id}
                  href={`#${s.id}`}
                  onClick={() => setOpen(false)}
                  className="block px-4 py-2 text-gray-700 hover:bg-gray-100"
                >
                  {s.label}
                </a>
              ))}
            </div>
          )}
        </div>
      );
    };

    const Hero = () => (
      <section id="hero" className="pt-24 bg-primary text-white">
        <div className="max-w-4xl mx-auto text-center py-20 px-4">
          <h1 className="text-4xl sm:text-5xl font-heading font-bold mb-4">
            Instagram Business Data Research & Lead Generation
          </h1>
          <p className="text-lg mb-8">
            Precise, compliant, and automated extraction of publicly available Instagram business contacts.
          </p>
          <a href="#contact" className="inline-block bg-white text-primary font-semibold py-3 px-6 rounded-full hover:bg-gray-100 transition">
            Get a Free Quote
          </a>
        </div>
      </section>
    );

    const servicesData = [
      {
        key: 'scraping',
        title: 'Instagram Scraping',
        description: 'Gather usernames, business names, emails, phone numbers, website URLs, categories & source links – all from public profiles.',
        icon: '📊',
      },
      {
        key: 'leadgen',
        title: 'Lead Generation',
        description: 'Turn scraped data into ready‑to‑use lead lists, de‑duplicated and validated for outreach campaigns.',
        icon: '🤝',
      },
      {
        key: 'validation',
        title: 'Data Validation',
        description: 'Cross‑check emails & phones against verification services, ensuring deliverability and compliance.',
        icon: '✅',
      },
    ];

    const Services = () => {
      const [active, setActive] = useState(servicesData[0].key);
      const current = servicesData.find(s => s.key === active);
      return (
        <section id="services" className="py-20 bg-gray-100">
          <div className="max-w-5xl mx-auto px-4">
            <h2 className="text-3xl font-heading text-center font-bold mb-12">What I Offer</h2>
            <div className="flex flex-col md:flex-row md:space-x-6">
              {/* Tabs */}
              <div className="md:w-1/3 mb-6 md:mb-0">
                {servicesData.map(s => (
                  <button
                    key={s.key}
                    onClick={() => setActive(s.key)}
                    className={`w-full text-left p-4 rounded-lg mb-2 transition ${
                      active === s.key
                        ? 'bg-primary text-white'
                        : 'bg-white text-gray-800 hover:bg-gray-200'
                    }`}
                  >
                    <span className="text-2xl mr-2">{s.icon}</span>
                    {s.title}
                  </button>
                ))}
              </div>
              {/* Content */}
              <div className="md:w-2/3 bg-white p-8 rounded-lg shadow-md">
                <h3 className="text-2xl font-heading font-semibold mb-4">{current.title}</h3>
                <p className="text-gray-700">{current.description}</p>
                <ul className="list-disc list-inside mt-4 text-gray-600">
                  <li>Only publicly disclosed information.</li>
                  <li>Compliant with GDPR & platform terms.</li>
                  <li>Delivered in clean Excel/CSV format.</li>
                  <li>Source URLs for every data point.</li>
                </ul>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const Process = () => (
      <section id="process" className="py-20">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-heading text-center font-bold mb-12">How It Works</h2>
          <div className="grid md:grid-cols-4 gap-8">
            {[
              { step: 1, title: 'Gather Targets', desc: 'Provide a list of Instagram business usernames or let us research niche‑specific accounts.' },
              { step: 2, title: 'Scrape Public Data', desc: 'Our Python bots extract all publicly available contact fields.' },
              { step: 3, title: 'Validate & Clean', desc: 'Emails & phones are verified, duplicates removed, and data is standardized.' },
              { step: 4, title: 'Deliver & Support', desc: 'Receive a ready‑to‑use spreadsheet with source links and a short methodology report.' },
            ].map(item => (
              <div key={item.step} className="bg-white p-6 rounded-lg shadow hover:shadow-lg transition">
                <div className="text-primary font-bold text-2xl mb-2">Step {item.step}</div>
                <h4 className="font-heading font-semibold mb-2">{item.title}</h4>
                <p className="text-gray-600">{item.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Pricing = () => (
      <section id="pricing" className="py-20 bg-gray-100">
        <div className="max-w-5xl mx-auto px-4 text-center">
          <h2 className="text-3xl font-heading font-bold mb-8">Pricing (example)</h2>
          <p className="text-gray-700 mb-12">
            Transparent, flat‑rate pricing. No hidden fees. Custom quotes for bulk projects.
          </p>
          <div className="grid md:grid-cols-3 gap-8">
            {[
              { name: 'Starter', price: '$199', desc: 'Up to 250 Instagram accounts', features: ['CSV output', 'Email verification', 'Source URLs'] },
              { name: 'Growth', price: '$699', desc: 'Up to 1,000 Instagram accounts', features: ['Excel & CSV', 'Phone verification', 'Deduplication', 'Methodology report'] },
              { name: 'Enterprise', price: 'Contact', desc: '10,000+ accounts & custom pipelines', features: ['Dedicated scraper', 'API access', 'Priority support'] },
            ].map(plan => (
              <div key={plan.name} className="bg-white rounded-lg shadow p-6 flex flex-col">
                <h3 className="font-heading text-xl font-semibold mb-2">{plan.name}</h3>
                <div className="text-3xl font-bold text-primary mb-4">{plan.price}</div>
                <p className="mb-4 text-gray-600">{plan.desc}</p>
                <ul className="text-left flex-1 mb-6">
                  {plan.features.map(f => (
                    <li key={f} className="flex items-center mb-2">
                      <svg className="h-5 w-5 text-primary mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                      </svg>
                      {f}
                    </li>
                  ))}
                </ul>
                <a href="#contact" className="mt-auto bg-primary text-white py-2 rounded hover:bg-primary/90 transition">
                  Get Started
                </a>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Contact = () => {
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });
      const [submitted, setSubmitted] = useState(false);

      const handleChange = e => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = e => {
        e.preventDefault();
        // In a real app you would post to an endpoint.
        setSubmitted(true);
      };

      return (
        <section id="contact" className="py-20">
          <div className="max-w-3xl mx-auto px-4">
            <h2 className="text-3xl font-heading text-center font-bold mb-8">Get In Touch</h2>
            {submitted ? (
              <div className="bg-white p-8 rounded-lg shadow text-center">
                <h3 className="text-2xl font-heading font-semibold mb-4">Thank you, {formData.name || 'Friend'}!</h3>
                <p className="text-gray-700">Your request has been received. I’ll get back to you within 24 hours.</p>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="bg-white p-8 rounded-lg shadow space-y-6">
                <div>
                  <label className="block font-medium mb-1">Name</label>
                  <input
                    type="text"
                    name="name"
                    required
                    value={formData.name}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary"
                  />
                </div>
                <div>
                  <label className="block font-medium mb-1">Email</label>
                  <input
                    type="email"
                    name="email"
                    required
                    value={formData.email}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary"
                  />
                </div>
                <div>
                  <label className="block font-medium mb-1">Message</label>
                  <textarea
                    name="message"
                    rows="4"
                    required
                    value={formData.message}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary"
                  />
                </div>
                <button type="submit" className="w-full bg-primary text-white py-2 rounded hover:bg-primary/90 transition">
                  Send Request
                </button>
              </form>
            )}
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-secondary text-white py-8">
        <div className="max-w-5xl mx-auto px-4 text-center">
          <p className="mb-2">© {new Date().getFullYear()} InstaBiz Insights – All Rights Reserved</p>
          <p className="text-sm">Prototype by <a href="https://github.com/shubh-mehta" className="underline hover:text-primary">Shubh Mehta (Dev)</a></p>
        </div>
      </footer>
    );

    const App = () => (
      <>
        <Navbar />
        <main className="pt-16">
          <Hero />
          <Services />
          <Process />
          <Pricing />
          <Contact />
        </main>
        <Footer />
      </>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
