<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HomeFix Pro – Repairs, Maintenance & Small Construction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1E3A8A',   /* Indigo-900 */
            secondary: '#F59E0B', /* Amber-500 */
          },
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            body: ['Open Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Heroicons (for service icons) -->
  <script src="https://unpkg.com/heroicons@2.0.16/dist/heroicons.min.js"></script>
  <style>
    body {font-family: var(--tw-font-body);}
    h1, h2, h3, h4 {font-family: var(--tw-font-heading);}
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div id="root"></div>

<!-- React & Babel -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">

const { useState } = React;

/* ==== NAVBAR ==== */
function NavBar() {
  const [mobileOpen, setMobileOpen] = useState(false);
  const menuItems = [
    { name: "Home", href: "#home" },
    { name: "Services", href: "#services" },
    { name: "Areas", href: "#areas" },
    { name: "Contact", href: "#contact" },
  ];

  return (
    <nav className="sticky top-0 bg-white shadow z-10">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex justify-between h-16 items-center">
          <a href="#home" className="text-2xl font-bold text-primary">HomeFix Pro</a>
          <div className="hidden md:flex space-x-8">
            {menuItems.map(item => (
              <a key={item.name} href={item.href}
                 className="text-gray-600 hover:text-primary transition">
                {item.name}
              </a>
            ))}
          </div>
          <button className="md:hidden p-2 rounded-md focus:outline-none"
                  onClick={() => setMobileOpen(!mobileOpen)}>
            {mobileOpen ?
              <svg className="h-6 w-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                      d="M6 18L18 6M6 6l12 12"/>
              </svg> :
              <svg className="h-6 w-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                      d="M4 6h16M4 12h16M4 18h16"/>
              </svg>}
          </button>
        </div>
      </div>

      {/* Mobile menu */}
      {mobileOpen && (
        <div className="md:hidden bg-white border-t border-gray-200">
          <div className="px-2 pt-2 pb-3 space-y-1">
            {menuItems.map(item => (
              <a key={item.name} href={item.href}
                 className="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-primary hover:text-white transition">
                {item.name}
              </a>
            ))}
          </div>
        </div>
      )}
    </nav>
  );
}

/* ==== HERO ==== */
function Hero() {
  return (
    <section id="home" className="bg-primary text-white py-20">
      <div className="max-w-4xl mx-auto text-center px-4">
        <h1 className="text-4xl md:text-5xl font-bold mb-4">Your Trusted Partner for Repairs, Maintenance & Small Construction</h1>
        <p className="text-lg md:text-xl mb-8">Fast, reliable, and affordable services for homeowners across the region.</p>
        <a href="#contact"
           className="inline-block bg-secondary hover:bg-secondary/80 text-white font-semibold py-3 px-6 rounded-md transition">
          Get a Free Quote
        </a>
      </div>
    </section>
  );
}

/* ==== SERVICES ==== */
function Services() {
  const services = [
    {
      name: "Plumbing",
      icon: "heroicons-outline:pipe",
      desc: "Leak repairs, faucet replacements, pipe installations, and emergency services.",
      price: "$80 – $200"
    },
    {
      name: "Electrical",
      icon: "heroicons-outline:bolt",
      desc: "Wiring, lighting, outlet repairs, and safety inspections.",
      price: "$90 – $250"
    },
    {
      name: "Carpentry",
      icon: "heroicons-outline:home-modern",
      desc: "Custom shelves, door repairs, trim work, and small renovations.",
      price: "$100 – $300"
    },
    {
      name: "Painting",
      icon: "heroicons-outline:paint-brush",
      desc: "Interior & exterior painting, surface prep, and color consultation.",
      price: "$150 – $500"
    },
    {
      name: "HVAC",
      icon: "heroicons-outline:sun",
      desc: "AC servicing, heater repairs, duct cleaning, and thermostat setup.",
      price: "$120 – $350"
    },
    {
      name: "Roofing",
      icon: "heroicons-outline:roof",
      desc: "Shingle replacement, leak detection, gutter cleaning, and inspections.",
      price: "$200 – $600"
    },
  ];

  return (
    <section id="services" className="py-16 bg-gray-100">
      <div className="max-w-6xl mx-auto px-4">
        <h2 className="text-3xl font-bold text-center text-primary mb-12">Our Services</h2>
        <div className="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
          {services.map(svc => (
            <div key={svc.name}
                 className="bg-white rounded-xl shadow hover:shadow-lg transition p-6 flex flex-col items-center text-center">
              {/* Icon */}
              <div className="text-primary mb-4">
                <svg className="h-12 w-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  {/* Simple placeholder icons; real icons could be swapped via Heroicons */}
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                        d={svc.name === "Plumbing" ? "M12 8v4l3 3" :
                           svc.name === "Electrical" ? "M9 12l2 2 4-4" :
                           svc.name === "Carpentry" ? "M4 6h16M4 12h16M4 18h16" :
                           svc.name === "Painting" ? "M12 4v16m8-8H4" :
                           svc.name === "HVAC" ? "M3 12h18M12 3v18" :
                           "M4 4h16v16H4z"} />
                </svg>
              </div>
              <h3 className="text-xl font-semibold text-gray-800 mb-2">{svc.name}</h3>
              <p className="text-gray-600 flex-1">{svc.desc}</p>
              <p className="mt-4 text-primary font-medium">Starting at {svc.price}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ==== AREAS ==== */
function Areas() {
  const areas = ["Springfield", "Rivertown", "Maplewood", "Lakeside", "Hillcrest", "Brookfield"];
  return (
    <section id="areas" className="py-16 bg-white">
      <div className="max-w-4xl mx-auto px-4 text-center">
        <h2 className="text-3xl font-bold text-primary mb-8">Areas We Serve</h2>
        <p className="text-gray-600 mb-6">Proudly providing top‑quality home services throughout these neighborhoods.</p>
        <ul className="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
          {areas.map(area => (
            <li key={area}
                className="bg-gray-50 rounded-md py-2 shadow hover:bg-primary hover:text-white transition">
              {area}
            </li>
          ))}
        </ul>
      </div>
    </section>
  );
}

/* ==== CONTACT ==== */
function Contact() {
  const [submitted, setSubmitted] = useState(false);
  const [form, setForm] = useState({ name: "", email: "", phone: "", message: "" });

  const handleChange = e => {
    const { name, value } = e.target;
    setForm(prev => ({ ...prev, [name]: value }));
  };

  const handleSubmit = e => {
    e.preventDefault();
    // In a real site you'd send the data to a server.
    setSubmitted(true);
  };

  if (submitted) {
    return (
      <section id="contact" className="py-20 bg-primary text-white">
        <div className="max-w-2xl mx-auto text-center px-4">
          <h2 className="text-3xl font-bold mb-4">Thank you!</h2>
          <p className="mb-6">We’ve received your request. One of our specialists will contact you within 24 hours.</p>
          <a href="#home" className="inline-block bg-secondary hover:bg-secondary/80 py-2 px-4 rounded-md transition">
            Back to Home
          </a>
        </div>
      </section>
    );
  }

  return (
    <section id="contact" className="py-20 bg-gray-100">
      <div className="max-w-2xl mx-auto px-4">
        <h2 className="text-3xl font-bold text-center text-primary mb-8">Get In Touch</h2>
        <form onSubmit={handleSubmit} className="space-y-6 bg-white rounded-xl shadow p-6">
          <div>
            <label className="block text-gray-700 font-medium mb-1" htmlFor="name">Name</label>
            <input required type="text" id="name" name="name"
                   value={form.name} onChange={handleChange}
                   className="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label className="block text-gray-700 font-medium mb-1" htmlFor="email">Email</label>
            <input required type="email" id="email" name="email"
                   value={form.email} onChange={handleChange}
                   className="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label className="block text-gray-700 font-medium mb-1" htmlFor="phone">Phone</label>
            <input required type="tel" id="phone" name="phone"
                   value={form.phone} onChange={handleChange}
                   className="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
          </div>
          <div>
            <label className="block text-gray-700 font-medium mb-1" htmlFor="message">Message</label>
            <textarea required id="message" name="message" rows="4"
                      value={form.message} onChange={handleChange}
                      className="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
          </div>
          <button type="submit"
                  className="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3 rounded-md transition">
            Send Request
          </button>
        </form>
        <div className="mt-8 text-center">
          <p className="text-gray-600">Or call us directly: <a href="tel:+15551234567" className="text-primary font-medium hover:underline">+1 (555) 123‑4567</a></p>
        </div>
      </div>
    </section>
  );
}

/* ==== FOOTER ==== */
function Footer() {
  return (
    <footer className="bg-gray-800 text-gray-200 py-8">
      <div className="max-w-6xl mx-auto px-4 grid md:grid-cols-3 gap-8">
        <div>
          <h3 className="font-semibold text-white mb-2">HomeFix Pro</h3>
          <p>123 Main Street<br/>Springfield, USA</p>
        </div>
        <div>
          <h3 className="font-semibold text-white mb-2">Contact</h3>
          <p>Phone: <a href="tel:+15551234567" className="hover:underline text-primary">+1 (555) 123‑4567</a></p>
          <p>Email: <a href="mailto:info@homefixpro.com" className="hover:underline text-primary">info@homefixpro.com</a></p>
        </div>
        <div className="flex items-center justify-center md:justify-end">
          <p className="text-sm">Prototype by <a href="https://github.com/shubh-mehta" className="underline text-secondary">Shubh Mehta (Dev)</a></p>
        </div>
      </div>
    </footer>
  );
}

/* ==== MAIN APP ==== */
function App() {
  return (
    <>
      <NavBar />
      <Hero />
      <Services />
      <Areas />
      <Contact />
      <Footer />
    </>
  );
}

/* ==== RENDER ==== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
