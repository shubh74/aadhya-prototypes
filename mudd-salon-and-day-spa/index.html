<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mudd Salon & Day Spa – Modern Redesign Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2C7A7B',   /* teal‑700 */
            accent:  '#F6AD55',   /* orange‑400 */
            muted:   '#F7FAFC',   /* gray‑50 */
          },
          fontFamily: {
            heading: ['Playfair Display', 'serif'],
            body: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-muted text-gray-800 font-body antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ---------- NAVIGATION ---------- */
    const NavBar = ({ onBook }) => {
      const [open, setOpen] = useState(false);
      return (
        <nav className="sticky top-0 bg-white shadow-md z-50">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <div className="flex items-center">
              <h1 className="text-2xl font-heading text-primary">Mudd Salon & Day Spa</h1>
            </div>
            {/* Desktop menu */}
            <div className="hidden md:flex space-x-6">
              <a href="#home" className="text-gray-600 hover:text-primary">Home</a>
              <a href="#services" className="text-gray-600 hover:text-primary">Services</a>
              <a href="#packages" className="text-gray-600 hover:text-primary">Packages</a>
              <a href="#testimonials" className="text-gray-600 hover:text-primary">Reviews</a>
              <a href="#contact" className="text-gray-600 hover:text-primary">Contact</a>
              <button onClick={onBook}
                className="ml-4 px-4 py-2 bg-primary text-white rounded hover:bg-primary/80 transition">
                Book Now
              </button>
            </div>
            {/* Mobile menu button */}
            <button className="md:hidden" onClick={() => setOpen(!open)}>
              <svg className="h-6 w-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                {open ? (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                ) : (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8h16M4 16h16" />
                )}
              </svg>
            </button>
          </div>
          {/* Mobile menu */}
          {open && (
            <div className="md:hidden bg-white border-t border-gray-200">
              <div className="px-2 pt-2 pb-3 space-y-1">
                <a href="#home" className="block px-3 py-2 rounded text-gray-600 hover:bg-primary/10 hover:text-primary">Home</a>
                <a href="#services" className="block px-3 py-2 rounded text-gray-600 hover:bg-primary/10 hover:text-primary">Services</a>
                <a href="#packages" className="block px-3 py-2 rounded text-gray-600 hover:bg-primary/10 hover:text-primary">Packages</a>
                <a href="#testimonials" className="block px-3 py-2 rounded text-gray-600 hover:bg-primary/10 hover:text-primary">Reviews</a>
                <a href="#contact" className="block px-3 py-2 rounded text-gray-600 hover:bg-primary/10 hover:text-primary">Contact</a>
                <button onClick={() => { setOpen(false); onBook(); }}
                  className="w-full text-left px-3 py-2 rounded bg-primary text-white hover:bg-primary/80 transition">
                  Book Now
                </button>
              </div>
            </div>
          )}
        </nav>
      );
    };

    /* ---------- HERO ---------- */
    const Hero = () => (
      <section id="home" className="bg-primary text-white text-center py-20 bg-[url('https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1400&q=80')] bg-cover bg-center">
        <div className="bg-black/40 py-20">
          <h2 className="text-5xl font-heading mb-4">Relax. Rejuvenate. Shine.</h2>
          <p className="text-xl mb-8 max-w-2xl mx-auto">
            Mumbai’s premier salon & day spa – where luxury meets holistic wellness.
          </p>
          <a href="#contact"
            className="inline-block bg-accent text-white px-6 py-3 rounded-full font-semibold hover:bg-accent/90 transition">
            Reserve Your Spot
          </a>
        </div>
      </section>
    );

    /* ---------- AUDIT ---------- */
    const Audit = () => (
      <section className="max-w-4xl mx-auto py-12 px-4">
        <h3 className="text-2xl font-heading text-primary mb-4">Current Site Audit (quick glance)</h3>
        <ul className="list-disc list-inside space-y-2 text-gray-700">
          <li>Heavy page weight – many un‑optimized images.</li>
          <li>Non‑responsive menu on smaller devices.</li>
          <li>Limited use of modern typography & brand colours.</li>
          <li>No clear CTA hierarchy – “Book Now” buried.</li>
          <li>Lacks interactive elements (gallery, live booking).</li>
        </ul>
      </section>
    );

    /* ---------- ABOUT ---------- */
    const About = () => (
      <section className="py-16 bg-muted">
        <div className="max-w-5xl mx-auto px-4 grid md:grid-cols-2 gap-8 items-center">
          <img src="https://images.unsplash.com/photo-1582719478250-9a1b5c5b8c3a?auto=format&fit=crop&w=800&q=80"
               alt="Mudd Salon interior"
               className="rounded-lg shadow-lg"/>
          <div>
            <h3 className="text-3xl font-heading text-primary mb-4">A Seaside Urban Retreat</h3>
            <p className="mb-4">
              Nestled on Byramjee Jeejeebhoy Road, just a 5‑minute stroll from Taj Lands End,
              Mudd blends modern treatments with ancient natural remedies. From skin‑care
              rituals to signature hair massages, every service is crafted with premium
              ingredients and expert hands.
            </p>
            <p className="mb-4">
              Ample parking, free Wi‑Fi, and ocean‑view rooms make each visit a
              truly indulgent escape.
            </p>
            <a href="#contact"
               className="inline-block bg-primary text-white px-5 py-2 rounded hover:bg-primary/80 transition">
              Get in Touch
            </a>
          </div>
        </div>
      </section>
    );

    /* ---------- SERVICES ---------- */
    const services = [
      { title: "Skin Care", icon: "🧖‍♀️", desc: "Facials, peels, and personalized skin regimens." },
      { title: "Hair Therapy", icon: "💇‍♀️", desc: "Haircuts, color, deep conditioning, and scalp massages." },
      { title: "Massage", icon: "🤲", desc: "Head, neck, shoulder, foot & full‑body massages." },
      { title: "Spa Packages", icon: "🛁", desc: "All‑inclusive day‑spa experiences for couples & groups." },
    ];
    const Services = () => (
      <section id="services" className="py-16">
        <div className="max-w-6xl mx-auto px-4 text-center">
          <h3 className="text-3xl font-heading text-primary mb-8">Our Signature Services</h3>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {services.map((s) => (
              <div key={s.title}
                   className="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition">
                <div className="text-4xl mb-4">{s.icon}</div>
                <h4 className="font-semibold text-xl mb-2">{s.title}</h4>
                <p className="text-gray-600">{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    /* ---------- PACKAGES ---------- */
    const packages = [
      {
        id: "MS01",
        name: "Ultimate Head Massage",
        items: ["Head Massage – ₹1,745", "Foot Reflexology – ₹1,085"],
        price: "₹2,500 (incl. GST)",
        original: "₹2,830",
        img: "https://images.unsplash.com/photo-1582719478250-9a1b5c5b8c3a?auto=format&fit=crop&w=500&q=80",
      },
      {
        id: "MS02",
        name: "Signature Head Massage",
        items: ["Head Massage – ₹1,045", "Foot Reflexology – ₹1,085", "Cleansing Facial – ₹2,745", "Hair Wash – ₹550"],
        price: "₹4,500 (incl. GST)",
        original: "₹5,420",
        img: "https://images.unsplash.com/photo-1602810318285-4e7b0c2c5e2c?auto=format&fit=crop&w=500&q=80",
      },
      {
        id: "MS03",
        name: "Aqua Mudd Glow Facial",
        items: ["Facial – ₹2,745", "Eye Treatment – ₹1,145", "Spa Pedicure – ₹2,250", "Hair Protein – ₹1,745"],
        price: "₹6,700 (incl. GST)",
        original: "₹7,885",
        img: "https://images.unsplash.com/photo-1602810318285-4e7b0c2c5e2c?auto=format&fit=crop&w=500&q=80",
      },
    ];
    const Packages = () => (
      <section id="packages" className="py-16 bg-muted">
        <div className="max-w-6xl mx-auto px-4">
          <h3 className="text-3xl font-heading text-primary text-center mb-12">Featured Packages</h3>
          <div className="grid md:grid-cols-3 gap-8">
            {packages.map((p) => (
              <div key={p.id}
                   className="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
                <img src={p.img} alt={p.name} className="w-full h-48 object-cover"/>
                <div className="p-6">
                  <h4 className="font-semibold text-xl mb-2">{p.name}</h4>
                  <ul className="list-disc list-inside text-sm text-gray-600 mb-3">
                    {p.items.map((it, i) => <li key={i}>{it}</li>)}
                  </ul>
                  <p className="text-lg font-bold text-primary mb-1">{p.price}</p>
                  <p className="text-sm line-through text-gray-500 mb-4">{p.original}</p>
                  <button className="w-full bg-primary text-white py-2 rounded hover:bg-primary/80 transition">
                    BUY NOW
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    /* ---------- TESTIMONIALS ---------- */
    const testimonials = [
      { name: "Mehu Daruwalla", text: "The foot massage was heavenly – perfect pressure & so relaxing. Jenny did a great job!" },
      { name: "Valhoy Marmda", text: "The quick‑fix head, neck & shoulder massage was blissful. I’ll definitely bring friends next time." },
      { name: "Hiba Pathan", text: "Love their facials & spa treatments. Ask for Claire – she’s lovely and great with massages." },
    ];
    const Testimonials = () => (
      <section id="testimonials" className="py-16">
        <div className="max-w-5xl mx-auto px-4 text-center">
          <h3 className="text-3xl font-heading text-primary mb-8">What Our Clients Say</h3>
          <div className="grid md:grid-cols-3 gap-6">
            {testimonials.map((t, i) => (
              <div key={i}
                   className="bg-white rounded-lg shadow-md p-6 hover:shadow-xl transition">
                <p className="italic text-gray-700 mb-4">"{t.text}"</p>
                <p className="font-semibold text-primary">{t.name}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    /* ---------- CONTACT & BOOKING FORM ---------- */
    const Contact = ({ onOpenBooking }) => (
      <section id="contact" className="py-16 bg-primary text-white">
        <div className="max-w-4xl mx-auto px-4 text-center">
          <h3 className="text-3xl font-heading mb-4">Visit Us</h3>
          <p className="mb-2">
            Near Sea Bird, Byramjee Jeejeebhai Road, Bandstand Promenade, Bandra (West), Mumbai – 400050
          </p>
          <p className="mb-4">Phone: <a href="tel:02226428756" className="underline">022 2642 8756</a> | Email: <a href="mailto:info.mudd@gmail.com" className="underline">info.mudd@gmail.com</a></p>
          <p className="mb-6">Hours: 10:30 am – 8:00 pm (Closed on Tuesdays)</p>
          <button onClick={onOpenBooking}
                  className="bg-accent text-white px-6 py-3 rounded-full font-semibold hover:bg-accent/90 transition">
            Book an Appointment
          </button>
        </div>
      </section>
    );

    const BookingForm = ({ onClose }) => {
      const [step, setStep] = useState(0);
      const [form, setForm] = useState({
        name: '',
        phone: '',
        service: '',
        date: '',
        time: '',
      });

      const servicesOptions = [
        "Ultimate Head Massage",
        "Signature Head Massage",
        "Aqua Mudd Glow Facial",
        "Custom Skin Care",
        "Hair Therapy",
        "Full Day Spa Package"
      ];

      const handleChange = (e) => {
        const { name, value } = e.target;
        setForm((prev) => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setStep(1); // show confirmation
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg max-w-lg w-full p-6 relative">
            <button onClick={onClose}
                    className="absolute top-2 right-2 text-gray-500 hover:text-gray-800">
              ✕
            </button>
            {step === 0 ? (
              <>
                <h4 className="text-xl font-semibold mb-4">Book Your Session</h4>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="text" name="name" placeholder="Your Name"
                         className="w-full border rounded px-3 py-2"
                         required value={form.name} onChange={handleChange}/>
                  <input type="tel" name="phone" placeholder="Phone Number"
                         className="w-full border rounded px-3 py-2"
                         required value={form.phone} onChange={handleChange}/>
                  <select name="service" required
                          className="w-full border rounded px-3 py-2"
                          value={form.service} onChange={handleChange}>
                    <option value="">Select Service</option>
                    {servicesOptions.map((s) => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <input type="date" name="date" required
                         className="w-full border rounded px-3 py-2"
                         value={form.date} onChange={handleChange}/>
                  <input type="time" name="time" required
                         className="w-full border rounded px-3 py-2"
                         value={form.time} onChange={handleChange}/>
                  <button type="submit"
                          className="w-full bg-primary text-white py-2 rounded hover:bg-primary/80 transition">
                    Confirm Booking
                  </button>
                </form>
              </>
            ) : (
              <div className="text-center">
                <h4 className="text-2xl font-semibold text-primary mb-4">Thank you, {form.name}!</h4>
                <p className="mb-4">Your request for <strong>{form.service}</strong> on <strong>{form.date}</strong> at <strong>{form.time}</strong> has been received.</p>
                <p className="mb-6">We’ll call you shortly at <strong>{form.phone}</strong> to confirm.</p>
                <button onClick={onClose}
                        className="bg-primary text-white px-5 py-2 rounded hover:bg-primary/80 transition">
                  Close
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

    /* ---------- FOOTER ---------- */
    const Footer = () => (
      <footer className="bg-gray-900 text-gray-200 py-8">
        <div className="max-w-6xl mx-auto px-4 text-center">
          <p className="mb-2">© {new Date().getFullYear()} Mudd Salon & Day Spa. All rights reserved.</p>
          <p className="text-sm">Prototype by <a href="https://github.com/shubhmehta" className="underline hover:text-white">Shubh Mehta (Dev)</a></p>
        </div>
      </footer>
    );

    /* ---------- MAIN APP ---------- */
    const App = () => {
      const [showBooking, setShowBooking] = useState(false);
      const openBooking = () => setShowBooking(true);
      const closeBooking = () => setShowBooking(false);

      return (
        <>
          <NavBar onBook={openBooking}/>
          <Hero/>
          <Audit/>
          <About/>
          <Services/>
          <Packages/>
          <Testimonials/>
          <Contact onOpenBooking={openBooking}/>
          <Footer/>
          {showBooking && <BookingForm onClose={closeBooking}/>}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
