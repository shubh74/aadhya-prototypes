<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomo Kids – Fun Learning for Little Explorers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6f61',   /* bright coral */
            secondary: '#ffb347', /* warm orange */
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">

    const { useState } = React;

    const Nav = ({ toggleMenu, isOpen }) => (
      <nav className="bg-white shadow-md sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
          <div className="flex items-center">
            <a href="#" className="text-2xl font-bold text-primary">Pomo Kids</a>
          </div>
          <div className="hidden md:flex space-x-6">
            <a href="#home" className="text-gray-700 hover:text-primary transition">Home</a>
            <a href="#about" className="text-gray-700 hover:text-primary transition">About</a>
            <a href="#videos" className="text-gray-700 hover:text-primary transition">Videos</a>
            <a href="#contact" className="text-gray-700 hover:text-primary transition">Contact</a>
          </div>
          <button className="md:hidden text-gray-700 focus:outline-none" onClick={toggleMenu}>
            <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              {isOpen ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
              )}
            </svg>
          </button>
        </div>
        {/* Mobile menu */}
        {isOpen && (
          <div className="md:hidden bg-white border-t border-gray-200">
            <div className="px-2 pt-2 pb-3 space-y-1">
              <a href="#home" className="block px-3 py-2 rounded-md text-gray-700 hover:bg-primary hover:text-white transition">Home</a>
              <a href="#about" className="block px-3 py-2 rounded-md text-gray-700 hover:bg-primary hover:text-white transition">About</a>
              <a href="#videos" className="block px-3 py-2 rounded-md text-gray-700 hover:bg-primary hover:text-white transition">Videos</a>
              <a href="#contact" className="block px-3 py-2 rounded-md text-gray-700 hover:bg-primary hover:text-white transition">Contact</a>
            </div>
          </div>
        )}
      </nav>
    );

    const Hero = () => (
      <section id="home" className="bg-primary text-white py-20">
        <div className="max-w-4xl mx-auto text-center px-4">
          <h1 className="text-4xl md:text-5xl font-bold mb-4">Explore, Learn & Play!</h1>
          <p className="text-xl mb-8">Fun-filled videos for curious kids – sing, dance, discover and grow together.</p>
          <a href="https://www.youtube.com/@PomoKids99" target="_blank" rel="noopener"
            className="inline-block bg-white text-primary font-semibold px-6 py-3 rounded-full shadow hover:bg-gray-100 transition">
            Visit Our YouTube Channel
          </a>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-16 bg-white">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center text-primary mb-8">About Pomo Kids</h2>
          <p className="text-lg text-center text-gray-700 max-w-3xl mx-auto">
            Pomo Kids is a vibrant YouTube channel that brings education and entertainment together.
            From catchy alphabet songs to playful science experiments, every video is crafted
            to spark imagination and foster early learning in a safe, kid‑friendly environment.
          </p>
          <div className="mt-10 grid md:grid-cols-3 gap-6">
            <div className="bg-gray-50 p-6 rounded-xl shadow hover:shadow-lg transition">
              <h3 className="text-xl font-semibold text-primary mb-2">🎨 Creative Arts</h3>
              <p className="text-gray-600">Colorful crafts, sing‑along songs, and dance routines that let kids express themselves.</p>
            </div>
            <div className="bg-gray-50 p-6 rounded-xl shadow hover:shadow-lg transition">
              <h3 className="text-xl font-semibold text-primary mb-2">🔬 Little Scientists</h3>
              <p className="text-gray-600">Simple experiments that turn everyday objects into magic moments of discovery.</p>
            </div>
            <div className="bg-gray-50 p-6 rounded-xl shadow hover:shadow-lg transition">
              <h3 className="text-xl font-semibold text-primary mb-2">📚 Early Literacy</h3>
              <p className="text-gray-600">Alphabet adventures, counting games, and storytime videos to build a strong foundation.</p>
            </div>
          </div>
        </div>
      </section>
    );

    const Videos = () => (
      <section id="videos" className="py-16 bg-gray-50">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center text-primary mb-8">Featured Videos</h2>
          <div className="aspect-w-16 aspect-h-9">
            <iframe
              className="w-full h-64 md:h-96 rounded-xl shadow-lg"
              src="https://www.youtube.com/embed/videoseries?list=UUX6Xb9Yv9H6cR6YVbL4bQKw"
              title="Pomo Kids Playlist"
              frameBorder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowFullScreen
            ></iframe>
          </div>
          <p className="text-center text-gray-600 mt-4">
            Dive into our latest playlist – new episodes added weekly!
          </p>
        </div>
      </section>
    );

    const Contact = () => {
      const [submitted, setSubmitted] = useState(false);
      const [form, setForm] = useState({ name: '', email: '', message: '' });

      const handleChange = (e) => {
        const { name, value } = e.target;
        setForm(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        // In a real app you'd send data to a server.
        setSubmitted(true);
      };

      if (submitted) {
        return (
          <section id="contact" className="py-16 bg-white">
            <div className="max-w-2xl mx-auto text-center px-4">
              <h2 className="text-3xl font-bold text-primary mb-4">Thank You!</h2>
              <p className="text-lg text-gray-700">
                Your message has been sent. We'll get back to you soon!
              </p>
            </div>
          </section>
        );
      }

      return (
        <section id="contact" className="py-16 bg-white">
          <div className="max-w-2xl mx-auto px-4">
            <h2 className="text-3xl font-bold text-center text-primary mb-8">Get in Touch</h2>
            <form onSubmit={handleSubmit} className="space-y-6">
              <div>
                <label className="block text-gray-700 mb-1">Name</label>
                <input
                  type="text"
                  name="name"
                  required
                  value={form.name}
                  onChange={handleChange}
                  className="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                />
              </div>
              <div>
                <label className="block text-gray-700 mb-1">Email</label>
                <input
                  type="email"
                  name="email"
                  required
                  value={form.email}
                  onChange={handleChange}
                  className="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                />
              </div>
              <div>
                <label className="block text-gray-700 mb-1">Message</label>
                <textarea
                  name="message"
                  required
                  rows="4"
                  value={form.message}
                  onChange={handleChange}
                  className="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                ></textarea>
              </div>
              <button type="submit"
                className="w-full bg-primary text-white font-semibold py-3 rounded-md hover:bg-secondary transition">
                Send Message
              </button>
            </form>
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-gray-800 text-gray-200 py-6">
        <div className="max-w-5xl mx-auto px-4 text-center">
          <p>© {new Date().getFullYear()} Pomo Kids. All rights reserved.</p>
          <p className="mt-2 text-sm">Prototype by <a href="https://github.com/shubh-mehta" className="underline hover:text-white">Shubh Mehta (Dev)</a></p>
        </div>
      </footer>
    );

    const App = () => {
      const [menuOpen, setMenuOpen] = useState(false);
      const toggleMenu = () => setMenuOpen(!menuOpen);
      return (
        <>
          <Nav toggleMenu={toggleMenu} isOpen={menuOpen} />
          <Hero />
          <About />
          <Videos />
          <Contact />
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
