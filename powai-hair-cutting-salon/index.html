<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powai Hair Cutting Salon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#d62828',
            secondary: '#f77f00',
            accent: '#fcbf49',
            neutral: '#003049',
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Open Sans', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>
<body class="font-body bg-gray-50 text-neutral">
  <div id="root"></div>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const NavBar = ({ mobileOpen, setMobileOpen }) => (
      <nav className="bg-white shadow-md sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
          <div className="flex items-center">
            <h1 className="text-2xl font-heading text-primary">Powai Hair Cutting Salon</h1>
          </div>
          <div className="hidden md:flex space-x-6">
            <a href="#services" className="text-neutral hover:text-primary transition">Services</a>
            <a href="#pricing" className="text-neutral hover:text-primary transition">Pricing</a>
            <a href="#gallery" className="text-neutral hover:text-primary transition">Gallery</a>
            <a href="#booking" className="text-neutral hover:text-primary transition">Book Now</a>
          </div>
          <button className="md:hidden text-primary focus:outline-none" onClick={() => setMobileOpen(!mobileOpen)}>
            <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              {mobileOpen ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8h16M4 16h16" />
              )}
            </svg>
          </button>
        </div>
        {mobileOpen && (
          <div className="md:hidden bg-white border-t border-gray-200">
            <div className="px-2 pt-2 pb-3 space-y-1">
              <a href="#services" className="block px-3 py-2 rounded-md text-base font-medium text-neutral hover:bg-primary hover:text-white transition">Services</a>
              <a href="#pricing" className="block px-3 py-2 rounded-md text-base font-medium text-neutral hover:bg-primary hover:text-white transition">Pricing</a>
              <a href="#gallery" className="block px-3 py-2 rounded-md text-base font-medium text-neutral hover:bg-primary hover:text-white transition">Gallery</a>
              <a href="#booking" className="block px-3 py-2 rounded-md text-base font-medium text-neutral hover:bg-primary hover:text-white transition">Book Now</a>
            </div>
          </div>
        )}
      </nav>
    );

    const Hero = () => (
      <section className="bg-primary text-white py-20">
        <div className="max-w-4xl mx-auto text-center px-4">
          <h2 className="text-4xl md:text-5xl font-heading mb-4">Style that Speaks</h2>
          <p className="text-lg md:text-xl mb-8">Expert hair cutting & styling in the heart of Powai. Walk‑in or book an appointment.</p>
          <a href="#booking" className="inline-block bg-white text-primary font-semibold py-3 px-6 rounded-full hover:bg-gray-100 transition">
            Book Your Slot
          </a>
        </div>
      </section>
    );

    const services = [
      { title: "Men’s Haircut", desc: "Classic, modern, or trend‑setting cuts.", icon: "✂️" },
      { title: "Women’s Styling", desc: "Blow‑dry, up‑dos, and personalized looks.", icon: "💇‍♀️" },
      { title: "Beard Trimming", desc: "Sharp lines, clean fades, and grooming.", icon: "🧔" },
      { title: "Hair Spa", desc: "Deep conditioning for silky smooth hair.", icon: "💆‍♀️" },
    ];

    const Services = () => (
      <section id="services" className="py-16 bg-gray-100">
        <div className="max-w-6xl mx-auto px-4">
          <h3 className="text-3xl font-heading text-center text-primary mb-12">Our Services</h3>
          <div className="grid gap-8 md:grid-cols-2 lg:grid-cols-4">
            {services.map((s, i) => (
              <div key={i} className="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
                <div className="text-4xl mb-4">{s.icon}</div>
                <h4 className="text-xl font-semibold mb-2">{s.title}</h4>
                <p className="text-gray-600">{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const pricing = [
      { service: "Men’s Haircut", price: "₹250" },
      { service: "Women’s Haircut", price: "₹350" },
      { service: "Beard Trim", price: "₹150" },
      { service: "Hair Spa (30 min)", price: "₹400" },
      { service: "Full Styling (incl. wash)", price: "₹600" },
    ];

    const Pricing = () => (
      <section id="pricing" className="py-16">
        <div className="max-w-4xl mx-auto px-4">
          <h3 className="text-3xl font-heading text-center text-primary mb-12">Pricing (Examples)</h3>
          <div className="bg-white rounded-xl shadow overflow-hidden">
            <table className="w-full text-left">
              <thead className="bg-primary text-white">
                <tr>
                  <th className="px-6 py-4">Service</th>
                  <th className="px-6 py-4">Price</th>
                </tr>
              </thead>
              <tbody>
                {pricing.map((p, i) => (
                  <tr key={i} className={i % 2 === 0 ? "bg-gray-50" : ""}>
                    <td className="px-6 py-4">{p.service}</td>
                    <td className="px-6 py-4">{p.price}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </section>
    );

    const Gallery = () => {
      const images = [
        "https://source.unsplash.com/featured/400x300?haircut",
        "https://source.unsplash.com/featured/401x300?salon",
        "https://source.unsplash.com/featured/402x300?hairstyle",
        "https://source.unsplash.com/featured/403x300?barber",
        "https://source.unsplash.com/featured/404x300?hairspa",
        "https://source.unsplash.com/featured/405x300?women-haircut",
      ];
      return (
        <section id="gallery" className="py-16 bg-gray-100">
          <div className="max-w-6xl mx-auto px-4">
            <h3 className="text-3xl font-heading text-center text-primary mb-12">Our Work</h3>
            <div className="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
              {images.map((src, i) => (
                <div key={i} className="overflow-hidden rounded-xl shadow hover:scale-105 transform transition">
                  <img src={src} alt="Salon work" className="w-full h-48 object-cover" />
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const BookingForm = () => {
      const [form, setForm] = useState({ name: "", email: "", date: "", service: "Men’s Haircut" });
      const [submitted, setSubmitted] = useState(false);

      const servicesOptions = services.map(s => s.title);

      const handleChange = e => {
        const { name, value } = e.target;
        setForm(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = e => {
        e.preventDefault();
        // In a real app you would send data to a server.
        setSubmitted(true);
      };

      if (submitted) {
        return (
          <section id="booking" className="py-16 bg-primary text-white">
            <div className="max-w-lg mx-auto text-center">
              <h3 className="text-2xl font-heading mb-4">Thank you, {form.name}!</h3>
              <p className="mb-6">Your appointment for <strong>{form.service}</strong> on <strong>{form.date}</strong> has been received.</p>
              <button className="bg-white text-primary font-semibold py-2 px-4 rounded-full hover:bg-gray-200 transition" onClick={() => setSubmitted(false)}>
                Book Another
              </button>
            </div>
          </section>
        );
      }

      return (
        <section id="booking" className="py-16 bg-white">
          <div className="max-w-lg mx-auto px-4">
            <h3 className="text-3xl font-heading text-center text-primary mb-8">Book an Appointment</h3>
            <form onSubmit={handleSubmit} className="space-y-4 bg-gray-50 p-6 rounded-xl shadow">
              <div>
                <label className="block text-sm font-medium mb-1">Name</label>
                <input type="text" name="name" required className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" value={form.name} onChange={handleChange} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" required className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" value={form.email} onChange={handleChange} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">Preferred Date</label>
                <input type="date" name="date" required className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" value={form.date} onChange={handleChange} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">Service</label>
                <select name="service" className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-primary" value={form.service} onChange={handleChange}>
                  {servicesOptions.map((opt, i) => (
                    <option key={i} value={opt}>{opt}</option>
                  ))}
                </select>
              </div>
              <button type="submit" className="w-full bg-primary text-white font-semibold py-2 rounded hover:bg-secondary transition">
                Confirm Booking
              </button>
            </form>
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-neutral text-white py-8">
        <div className="max-w-6xl mx-auto px-4 text-center">
          <p className="mb-2">Powai Hair Cutting Salon</p>
          <p className="mb-2">Padmavati Devi Marg, Ramabai Ambedkar Nagar, Kanjur West, Mumbai</p>
          <p className="text-sm">Prototype by Shubh Mehta (Dev)</p>
        </div>
      </footer>
    );

    const App = () => {
      const [mobileOpen, setMobileOpen] = useState(false);
      return (
        <>
          <NavBar mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
          <Hero />
          <Services />
          <Pricing />
          <Gallery />
          <BookingForm />
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
