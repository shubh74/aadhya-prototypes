<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Totendra Y Agni – Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0d9488',   /* teal-600 */
            secondary: '#14b8a6', /* teal-500 */
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <div id="root"></div>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const sections = [
      { id: 'home', label: 'Home' },
      { id: 'about', label: 'About Me' },
      { id: 'education', label: 'Education' },
      { id: 'skills', label: 'Skills' },
      { id: 'resume', label: 'Resume' },
      { id: 'contact', label: 'Contact' },
    ];

    const NavBar = ({ mobileOpen, setMobileOpen }) => (
      <nav className="sticky top-0 bg-white shadow-md z-10">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
          <div className="text-2xl font-semibold text-primary">Totendra Y Agni</div>
          <div className="hidden md:flex space-x-6">
            {sections.map(s => (
              <a key={s.id} href={`#${s.id}`} className="text-gray-600 hover:text-primary transition">
                {s.label}
              </a>
            ))}
          </div>
          <button
            className="md:hidden p-2 rounded-md text-gray-600 hover:bg-gray-100 focus:outline-none"
            onClick={() => setMobileOpen(!mobileOpen)}
            aria-label="Toggle menu"
          >
            <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              {mobileOpen ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8h16M4 16h16"/>
              )}
            </svg>
          </button>
        </div>
        {/* Mobile menu */}
        {mobileOpen && (
          <div className="md:hidden bg-white border-t border-gray-200">
            <div className="px-2 pt-2 pb-3 space-y-1">
              {sections.map(s => (
                <a
                  key={s.id}
                  href={`#${s.id}`}
                  className="block px-3 py-2 rounded-md text-gray-600 hover:bg-gray-100 hover:text-primary transition"
                  onClick={() => setMobileOpen(false)}
                >
                  {s.label}
                </a>
              ))}
            </div>
          </div>
        )}
      </nav>
    );

    const Hero = () => (
      <section id="home" className="bg-primary text-white py-20">
        <div className="max-w-4xl mx-auto text-center px-4">
          <h1 className="text-4xl md:text-5xl font-semibold mb-4">Totendra Y Agni</h1>
          <p className="text-xl md:text-2xl mb-8">Aspiring Data‑Entry & Office Professional | Tally Expert</p>
          <a
            href="#resume"
            className="inline-block bg-white text-primary font-medium py-3 px-6 rounded-full hover:bg-gray-100 transition"
          >
            Download My Resume
          </a>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-16">
        <div className="max-w-4xl mx-auto px-4">
          <h2 className="text-3xl font-semibold text-primary mb-6">About Me</h2>
          <p className="text-lg leading-relaxed">
            I am Totendra Y Agni, currently in the 5th semester of my B.A. (Optional English, Political Science,
            Sociology). I have also completed a six‑month certified computer course where I mastered Tally
            and other office‑automation tools. My goal is to secure a data‑entry or office‑assistant role where I
            can apply my analytical mindset, strong communication skills, and attention to detail.
          </p>
        </div>
      </section>
    );

    const Education = () => (
      <section id="education" className="py-16 bg-gray-100">
        <div className="max-w-4xl mx-auto px-4">
          <h2 className="text-3xl font-semibold text-primary mb-6">Education</h2>
          <ul className="space-y-4">
            <li className="bg-white p-4 rounded-lg shadow-sm">
              <h3 className="font-medium text-lg">B.A. (Optional English, Political Science, Sociology)</h3>
              <p className="text-gray-600">University of XYZ – 2022‑Present (5th Semester)</p>
            </li>
            <li className="bg-white p-4 rounded-lg shadow-sm">
              <h3 className="font-medium text-lg">Certificate in Computer Applications (Tally)</h3>
              <p className="text-gray-600">ABC Institute – Completed June 2023</p>
            </li>
          </ul>
        </div>
      </section>
    );

    const Skills = () => {
      const skillList = [
        { name: 'Tally ERP 9', level: 'Advanced' },
        { name: 'Microsoft Office (Word, Excel, PowerPoint)', level: 'Advanced' },
        { name: 'Data Entry', level: 'Proficient' },
        { name: 'Basic HTML & CSS', level: 'Intermediate' },
        { name: 'Communication', level: 'Strong' },
      ];
      return (
        <section id="skills" className="py-16">
          <div className="max-w-4xl mx-auto px-4">
            <h2 className="text-3xl font-semibold text-primary mb-6">Skills</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {skillList.map((skill, i) => (
                <div key={i} className="bg-white p-5 rounded-lg shadow hover:shadow-md transition">
                  <h3 className="font-medium text-lg">{skill.name}</h3>
                  <p className="text-gray-600">{skill.level}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Resume = () => (
      <section id="resume" className="py-16 bg-gray-100">
        <div className="max-w-4xl mx-auto px-4 text-center">
          <h2 className="text-3xl font-semibold text-primary mb-6">Resume</h2>
          <p className="mb-8">
            Click the button below to download a PDF version of my résumé. Feel free to share it with potential
            employers.
          </p>
          <a
            href="https://example.com/resume.pdf"  /* replace with actual PDF URL */
            download
            className="inline-block bg-primary text-white font-medium py-3 px-6 rounded-full hover:bg-secondary transition"
          >
            Download PDF
          </a>
        </div>
      </section>
    );

    const Contact = () => {
      const [submitted, setSubmitted] = useState(false);
      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
      };
      return (
        <section id="contact" className="py-16">
          <div className="max-w-4xl mx-auto px-4">
            <h2 className="text-3xl font-semibold text-primary mb-6 text-center">Contact</h2>
            {submitted ? (
              <div className="bg-green-100 border border-green-200 text-green-800 p-4 rounded-lg text-center">
                Thank you! Your message has been sent. I will get back to you shortly.
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4 max-w-lg mx-auto">
                <div>
                  <label className="block text-sm font-medium mb-1" htmlFor="name">Name</label>
                  <input required id="name" type="text" className="w-full border rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1" htmlFor="email">Email</label>
                  <input required id="email" type="email" className="w-full border rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1" htmlFor="message">Message</label>
                  <textarea required id="message" rows="4" className="w-full border rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                </div>
                <button type="submit" className="w-full bg-primary text-white py-2 rounded-md hover:bg-secondary transition">
                  Send Message
                </button>
              </form>
            )}
            <div className="mt-10 text-center space-y-2">
              <p><strong>Phone:</strong> +91‑98765‑43210</p>
              <p><strong>Email:</strong> totendra.agni@example.com</p>
              <p><strong>Location:</strong> Jaipur, Rajasthan, India</p>
            </div>
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-primary text-white py-6">
        <div className="max-w-4xl mx-auto px-4 text-center">
          <p>&copy; {new Date().getFullYear()} Totendra Y Agni. All rights reserved.</p>
          <p className="text-sm">Prototype by Shubh Mehta (Dev)</p>
        </div>
      </footer>
    );

    const App = () => {
      const [mobileOpen, setMobileOpen] = useState(false);
      return (
        <>
          <NavBar mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
          <main className="pt-4">
            <Hero />
            <About />
            <Education />
            <Skills />
            <Resume />
            <Contact />
          </main>
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
