<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomback – Your Restaurant’s Own Ordering App</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ff6b6b',
            secondary: '#2d3748',
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>
    body {font-family: var(--tw-font-body);}
    h1, h2, h3 {font-family: var(--tw-font-heading);}
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">

    const { useState } = React;

    const Nav = ({ onMenuToggle, menuOpen }) => (
      <nav className="bg-white shadow-sm sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
          <a href="#" className="text-2xl font-bold text-primary">Nomback</a>
          <div className="hidden md:flex space-x-6">
            <a href="#how" className="text-gray-600 hover:text-primary">How it works</a>
            <a href="#pricing" className="text-gray-600 hover:text-primary">Pricing</a>
            <a href="#demo" className="text-gray-600 hover:text-primary">Demo</a>
            <a href="#contact" className="text-gray-600 hover:text-primary">Contact</a>
          </div>
          <button
            className="md:hidden text-gray-600 focus:outline-none"
            onClick={onMenuToggle}
            aria-label="Toggle menu"
          >
            {menuOpen ? (
              <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              </svg>
            ) : (
              <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            )}
          </button>
        </div>
        {/* Mobile menu */}
        {menuOpen && (
          <div className="md:hidden bg-white border-t border-gray-200">
            <div className="px-2 pt-2 pb-3 space-y-1">
              <a href="#how" className="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-gray-100">How it works</a>
              <a href="#pricing" className="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-gray-100">Pricing</a>
              <a href="#demo" className="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-gray-100">Demo</a>
              <a href="#contact" className="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-gray-100">Contact</a>
            </div>
          </div>
        )}
      </nav>
    );

    const Hero = () => (
      <section className="bg-primary text-white py-20">
        <div className="max-w-4xl mx-auto text-center px-4">
          <h1 className="text-4xl md:text-5xl font-bold mb-4">Your Restaurant’s Own Ordering App – No Subscription</h1>
          <p className="text-lg md:text-xl mb-8">
            Keep 100% of every order. Pay only $1 per order. No setup fee, no monthly fee.
          </p>
          <a href="#contact" className="inline-block bg-white text-primary font-semibold py-3 px-8 rounded-full shadow-lg hover:bg-gray-100 transition">
            Get Started Free
          </a>
        </div>
      </section>
    );

    const HowItWorks = () => (
      <section id="how" className="py-16">
        <div className="max-w-6xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center mb-12">How It Works</h2>
          <div className="grid md:grid-cols-3 gap-8">
            <div className="bg-white rounded-xl shadow-sm p-6 text-center">
              <div className="flex items-center justify-center mb-4">
                <svg className="h-12 w-12 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2-1.343-2-3-2z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14c-4.418 0-8 1.79-8 4v2h16v-2c0-2.21-3.582-4-8-4z" />
                </svg>
              </div>
              <h3 className="font-semibold text-lg mb-2">1. We Build Your App</h3>
              <p className="text-gray-600">Your brand, your colors, your menu – live on iOS and Android under your own name.</p>
            </div>
            <div className="bg-white rounded-xl shadow-sm p-6 text-center">
              <div className="flex items-center justify-center mb-4">
                <svg className="h-12 w-12 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 7h18M3 12h18M3 17h18" />
                </svg>
              </div>
              <h3 className="font-semibold text-lg mb-2">2. Customers Order Directly</h3>
              <p className="text-gray-600">No middle‑man. Orders go straight to your kitchen and POS.</p>
            </div>
            <div className="bg-white rounded-xl shadow-sm p-6 text-center">
              <div className="flex items-center justify-center mb-4">
                <svg className="h-12 w-12 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-3-3v6" />
                </svg>
              </div>
              <h3 className="font-semibold text-lg mb-2">3. Pay Only $1 per Order</h3>
              <p className="text-gray-600">Same card fees you already pay. No hidden costs.</p>
            </div>
          </div>
        </div>
      </section>
    );

    const Pricing = () => {
      const [orders, setOrders] = useState(0);
      const doorDashPickup = orders * 30 * 0.06; // 6% of $30 per order
      const doorDashDelivery = orders * 30 * 0.30; // 30% of $30 per order
      const nombackCost = orders * 1; // $1 per order

      return (
        <section id="pricing" className="bg-gray-100 py-16">
          <div className="max-w-5xl mx-auto px-4">
            <h2 className="text-3xl font-bold text-center mb-12">Pricing that Makes Sense</h2>
            <div className="grid md:grid-cols-2 gap-8">
              {/* Pricing Table */}
              <div className="bg-white rounded-xl shadow-sm p-8">
                <h3 className="text-2xl font-semibold mb-4">Nomback</h3>
                <p className="text-gray-600 mb-6">Zero setup. Zero monthly. $1 per order.</p>
                <ul className="space-y-2 mb-6">
                  <li className="flex items-center"><svg className="h-5 w-5 text-primary mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>Branded iOS & Android apps</li>
                  <li className="flex items-center"><svg className="h-5 w-5 text-primary mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>No subscription fees</li>
                  <li className="flex items-center"><svg className="h-5 w-5 text-primary mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>Only $1 per order</li>
                </ul>
                <button className="w-full bg-primary text-white py-3 rounded-full font-semibold hover:bg-primary/90 transition">
                  Start for Free
                </button>
              </div>

              {/* Cost Calculator */}
              <div className="bg-white rounded-xl shadow-sm p-8">
                <h3 className="text-xl font-semibold mb-4">See the Savings</h3>
                <label className="block text-sm font-medium text-gray-700 mb-2">
                  Estimated monthly orders
                </label>
                <input
                  type="number"
                  min="0"
                  value={orders}
                  onChange={e => setOrders(Number(e.target.value))}
                  className="w-full border rounded-md p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-primary"
                />
                <div className="space-y-2">
                  <p><strong>Nomback cost:</strong> ${nombackCost.toFixed(2)} / month</p>
                  <p><strong>DoorDash (Pickup 6%):</strong> ${doorDashPickup.toFixed(2)} / month</p>
                  <p><strong>DoorDash (Delivery 30%):</strong> ${doorDashDelivery.toFixed(2)} / month</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const Demo = () => (
      <section id="demo" className="py-16">
        <div className="max-w-6xl mx-auto px-4 text-center">
          <h2 className="text-3xl font-bold mb-8">Live Demo – Pizza Palace</h2>
          <div className="aspect-w-16 aspect-h-9 rounded-xl overflow-hidden shadow-lg">
            <iframe
              src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&showinfo=0"
              title="Demo video"
              allowFullScreen
              className="w-full h-full"
            ></iframe>
          </div>
          <p className="mt-6 text-gray-600">Watch how a local pizzeria increased profit by 45% after switching to Nomback.</p>
        </div>
      </section>
    );

    const Testimonials = () => (
      <section className="bg-gray-100 py-16">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center mb-12">What Our Partners Say</h2>
          <div className="grid md:grid-cols-2 gap-8">
            <div className="bg-white rounded-xl p-6 shadow-sm">
              <p className="italic text-gray-800 mb-4">"We stopped paying 30% on every delivery. With Nomback we keep the margin and our customers love the branded app."</p>
              <p className="font-semibold">– Marco, Owner of Bella Pasta</p>
            </div>
            <div className="bg-white rounded-xl p-6 shadow-sm">
              <p className="italic text-gray-800 mb-4">"The $1 per order model made it painless to try. After the first month we were already saving $800!"</p>
              <p className="font-semibold">– Lisa, Manager of Green Garden Café</p>
            </div>
          </div>
        </div>
      </section>
    );

    const Contact = () => {
      const [sent, setSent] = useState(false);
      const [form, setForm] = useState({ name: '', email: '', message: '' });

      const handleChange = e => {
        const { name, value } = e.target;
        setForm(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = e => {
        e.preventDefault();
        // In a real app you'd send the data somewhere.
        setSent(true);
      };

      return (
        <section id="contact" className="bg-primary text-white py-20">
          <div className="max-w-3xl mx-auto px-4">
            <h2 className="text-3xl font-bold text-center mb-8">Ready to Go Live?</h2>
            {sent ? (
              <div className="bg-white text-primary p-6 rounded-xl text-center">
                <p className="font-semibold mb-4">Thank you! We’ll be in touch shortly.</p>
                <button
                  className="mt-4 bg-primary text-white py-2 px-4 rounded"
                  onClick={() => setSent(false)}
                >
                  Send Another Message
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block mb-1">Name</label>
                  <input
                    type="text"
                    name="name"
                    required
                    value={form.name}
                    onChange={handleChange}
                    className="w-full rounded-md p-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-white"
                  />
                </div>
                <div>
                  <label className="block mb-1">Email</label>
                  <input
                    type="email"
                    name="email"
                    required
                    value={form.email}
                    onChange={handleChange}
                    className="w-full rounded-md p-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-white"
                  />
                </div>
                <div>
                  <label className="block mb-1">Message</label>
                  <textarea
                    name="message"
                    rows="4"
                    required
                    value={form.message}
                    onChange={handleChange}
                    className="w-full rounded-md p-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-white"
                  ></textarea>
                </div>
                <button
                  type="submit"
                  className="w-full bg-white text-primary font-semibold py-3 rounded-full hover:bg-gray-100 transition"
                >
                  Send Message
                </button>
              </form>
            )}
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-secondary text-gray-200 py-6">
        <div className="max-w-6xl mx-auto px-4 text-center">
          <p>&copy; {new Date().getFullYear()} Nomback. All rights reserved.</p>
          <p className="text-sm">Prototype by Shubh Mehta (Dev)</p>
        </div>
      </footer>
    );

    const App = () => {
      const [menuOpen, setMenuOpen] = useState(false);
      return (
        <>
          <Nav onMenuToggle={() => setMenuOpen(!menuOpen)} menuOpen={menuOpen} />
          <Hero />
          <HowItWorks />
          <Pricing />
          <Demo />
          <Testimonials />
          <Contact />
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
