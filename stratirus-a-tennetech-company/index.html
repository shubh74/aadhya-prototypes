<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stratirus – AI Developer + Linux Admin (Remote)</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600&display=swap"
        rel="stylesheet">

  <!-- Tailwind CSS (via CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            },
          },
        },
      },
    };
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (for JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  const NavBar = ({ onToggle }) => {
    const [isOpen, setIsOpen] = useState(false);
    const toggle = () => {
      setIsOpen(!isOpen);
      if (onToggle) onToggle(!isOpen);
    };
    return (
      <nav className="sticky top-0 z-10 bg-white shadow-md">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
          <a href="#" className="text-2xl font-heading text-primary-600">Stratirus</a>
          <button className="lg:hidden p-2 rounded-md text-slate-600 hover:bg-slate-100"
                  onClick={toggle} aria-label="Toggle menu">
            <svg className="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              {isOpen ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                      d="M6 18L18 6M6 6l12 12"/>
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                      d="M4 6h16M4 12h16M4 18h16"/>
              )}
            </svg>
          </button>
          <div className={`lg:flex space-x-6 text-sm font-medium ${isOpen ? 'block' : 'hidden'} mt-4 lg:mt-0`}>
            <a href="#about" className="block py-2 px-3 rounded hover:bg-slate-100">About</a>
            <a href="#role" className="block py-2 px-3 rounded hover:bg-slate-100">The Role</a>
            <a href="#apply" className="block py-2 px-3 rounded hover:bg-slate-100">Apply</a>
          </div>
        </div>
      </nav>
    );
  };

  const Hero = () => (
    <section className="bg-primary-600 text-white py-20">
      <div className="max-w-4xl mx-auto text-center px-4">
        <h1 className="text-4xl md:text-5xl font-heading font-bold mb-4">
          AI Developer + Linux Admin (Remote)
        </h1>
        <p className="text-lg md:text-xl mb-8">
          Join Stratirus, a Tennetech company, and help small‑businesses thrive with AI agents and rock‑solid Linux ops.
        </p>
        <a href="#apply"
           className="inline-block bg-white text-primary-600 font-medium py-3 px-6 rounded-full hover:bg-slate-100 transition">
          Apply Now
        </a>
      </div>
    </section>
  );

  const About = () => (
    <section id="about" className="py-16 px-4 sm:px-6 lg:px-8 bg-white">
      <div className="max-w-5xl mx-auto">
        <h2 className="text-3xl font-heading text-primary-600 mb-6 text-center">Who We Are</h2>
        <p className="text-lg text-slate-700 leading-relaxed mb-8">
          Stratirus, a Tennetech company, is a fast‑growing AI and Microsoft 365 consultancy based in Franklin, TN.
          We build AI agents, automation, and hardened Linux & Microsoft 365 infrastructures for small‑ and
          mid‑sized businesses. Our stack is AI‑agnostic – we pick the best tool for the job, from Claude Code
          to Microsoft Copilot, Gemini, and Oracle OBI.
        </p>
        <div className="grid md:grid-cols-2 gap-8">
          <div className="bg-slate-50 p-6 rounded-lg shadow-sm">
            <h3 className="font-heading text-primary-600 mb-3">Our Mission</h3>
            <p className="text-slate-700">
              Empower businesses with intelligent automation while keeping their underlying systems secure,
              reliable, and easy to manage.
            </p>
          </div>
          <div className="bg-slate-50 p-6 rounded-lg shadow-sm">
            <h3 className="font-heading text-primary-600 mb-3">Our Stack</h3>
            <ul className="list-disc list-inside text-slate-700">
              <li>AI: Claude Code, Microsoft Copilot, Gemini</li>
              <li>Automation: Power Automate, MCP servers</li>
              <li>Linux: Ubuntu, Docker, systemd, monitoring</li>
              <li>Microsoft 365: SharePoint, Teams, security</li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  );

  const RoleDetails = () => {
    const [tab, setTab] = useState('dev');
    const tabs = [
      { id: 'dev', label: 'AI Development', content: (
        <ul className="list-disc list-inside space-y-2">
          <li>Build agents on Claude Code, Copilot Studio, Gemini.</li>
          <li>Create read‑only MCP tools for monitoring.</li>
          <li>Integrate with Power Automate & Microsoft 365.</li>
          <li>Write clean, testable code; use AI daily.</li>
        </ul>
      )},
      { id: 'ops', label: 'Linux Ops', content: (
        <ul className="list-disc list-inside space-y-2">
          <li>Maintain Ubuntu servers – systemd, Docker, patching.</li>
          <li>Write scripts that self‑heal a fresh box.</li>
          <li>Set up backups, monitoring, and alerting.</li>
          <li>Diagnose and fix flaky services (the “challenge”).</li>
        </ul>
      )},
    ];
    return (
      <section id="role" className="py-16 px-4 sm:px-6 lg:px-8 bg-slate-50">
        <div className="max-w-5xl mx-auto">
          <h2 className="text-3xl font-heading text-primary-600 mb-6 text-center">The Role</h2>
          <p className="text-lg text-slate-700 mb-8">
            60 % AI development, 40 % Ubuntu administration. You’ll work directly with clients, explain solutions
            in plain language, and use AI every day – knowing when it’s wrong is as important as building it.
          </p>

          {/* Tab Switch */}
          <div className="border-b border-slate-200 mb-6">
            <nav className="-mb-px flex space-x-4">
              {tabs.map(t => (
                <button key={t.id}
                        className={`pb-2 px-4 text-sm font-medium border-b-2 ${
                          tab===t.id ? 'border-primary-600 text-primary-600' : 'border-transparent text-slate-600 hover:text-primary-600'
                        }`}
                        onClick={() => setTab(t.id)}>
                  {t.label}
                </button>
              ))}
            </nav>
          </div>

          <div className="bg-white p-6 rounded-lg shadow-sm">
            {tabs.find(t=>t.id===tab).content}
          </div>

          <div className="mt-8 grid md:grid-cols-2 gap-6">
            <div className="p-4 bg-white rounded-lg shadow-sm">
              <h3 className="font-heading text-primary-600 mb-2">What We Offer</h3>
              <ul className="list-disc list-inside text-slate-700 space-y-1">
                <li>$65 k – $100 k (full‑time/part‑time, contract or hire)</li>
                <li>Remote – US Central Time only</li>
                <li>AI‑first culture, mentorship, growth</li>
                <li>No agencies, no sponsorship needed</li>
              </ul>
            </div>
            <div className="p-4 bg-white rounded-lg shadow-sm">
              <h3 className="font-heading text-primary-600 mb-2">Optional Challenge (60‑90 min)</h3>
              <p className="text-slate-700">
                Fix a broken Ubuntu box, write a self‑healing script, and build a read‑only MCP tool. No LeetCode,
                no pay – just a chance to showcase your style.
              </p>
              <a href="https://github.com/Stratirus/ops-agent-challenge"
                 target="_blank"
                 className="inline-block mt-2 text-primary-600 underline">View Challenge Repo</a>
            </div>
          </div>
        </div>
      </section>
    );
  };

  const ApplyForm = () => {
    const [submitted, setSubmitted] = useState(false);
    const [form, setForm] = useState({ name: '', email: '' });

    const handleChange = e => {
      const { name, value } = e.target;
      setForm(prev => ({ ...prev, [name]: value }));
    };

    const handleSubmit = e => {
      e.preventDefault();
      // In a real site we'd POST to an endpoint.
      setSubmitted(true);
    };

    return (
      <section id="apply" className="py-16 px-4 sm:px-6 lg:px-8 bg-white">
        <div className="max-w-lg mx-auto">
          <h2 className="text-3xl font-heading text-primary-600 mb-6 text-center">Apply Today</h2>
          {submitted ? (
            <div className="p-6 bg-primary-50 text-primary-800 rounded-lg shadow-sm text-center">
              <p className="font-medium mb-2">Thanks, {form.name || 'friend'}!</p>
              <p>We’ve received your interest. Expect an email from <a href="mailto:hiring@stratirus.com"
                 className="underline">hiring@stratirus.com</a> soon.</p>
            </div>
          ) : (
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1" htmlFor="name">Full Name</label>
                <input type="text" id="name" name="name" required
                       className="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500"
                       value={form.name} onChange={handleChange}/>
              </div>
              <div>
                <label className="block text-sm font-medium mb-1" htmlFor="email">Email</label>
                <input type="email" id="email" name="email" required
                       className="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500"
                       value={form.email} onChange={handleChange}/>
              </div>
              <button type="submit"
                      className="w-full bg-primary-600 text-white font-medium py-2 rounded hover:bg-primary-700 transition">
                Send My Resume
              </button>
            </form>
          )}
          <p className="mt-6 text-sm text-slate-600">
            Email your resume directly to <a href="mailto:hiring@stratirus.com"
            className="underline text-primary-600">hiring@stratirus.com</a> with answers to the three
            application questions (see the repo README).
          </p>
        </div>
      </section>
    );
  };

  const Footer = () => (
    <footer className="bg-slate-800 text-slate-200 py-8">
      <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p className="mb-4">
          © {new Date().getFullYear()} Stratirus – All rights reserved.
        </p>
        <p className="text-sm">
          Prototype by <a href="https://github.com/shubh-mehta" target="_blank"
                         className="underline text-primary-300">Shubh Mehta (Dev)</a>
        </p>
      </div>
    </footer>
  );

  const App = () => (
    <>
      <NavBar />
      <Hero />
      <About />
      <RoleDetails />
      <ApplyForm />
      <Footer />
    </>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
