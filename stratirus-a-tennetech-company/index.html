<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stratirus | AI Developer + Linux Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui'],
          },
          colors: {
            primary: '#1E3A8A',   /* indigo‑900 */
            secondary: '#3B82F6', /* blue‑500 */
          },
        },
      },
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<div id="root"></div>

<!-- React & Babel -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState } = React;

function Navbar() {
  const [open, setOpen] = useState(false);
  return (
    <nav className="bg-white shadow sticky top-0 z-10">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex justify-between h-16 items-center">
          <div className="flex-shrink-0 text-2xl font-bold text-primary">
            Stratirus
          </div>
          <div className="hidden md:flex space-x-8">
            <a href="#about" className="text-gray-600 hover:text-primary">About</a>
            <a href="#services" className="text-gray-600 hover:text-primary">Services</a>
            <a href="#challenge" className="text-gray-600 hover:text-primary">Challenge</a>
            <a href="#contact" className="text-gray-600 hover:text-primary">Contact</a>
          </div>
          <button className="md:hidden p-2 rounded-md focus:outline-none" onClick={() => setOpen(!open)}>
            <svg className="h-6 w-6 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              {open ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/>
              )}
            </svg>
          </button>
        </div>
      </div>
      {open && (
        <div className="md:hidden bg-white">
          <div className="px-2 pt-2 pb-3 space-y-1">
            <a href="#about" className="block px-3 py-2 rounded-md text-gray-600 hover:bg-gray-100">About</a>
            <a href="#services" className="block px-3 py-2 rounded-md text-gray-600 hover:bg-gray-100">Services</a>
            <a href="#challenge" className="block px-3 py-2 rounded-md text-gray-600 hover:bg-gray-100">Challenge</a>
            <a href="#contact" className="block px-3 py-2 rounded-md text-gray-600 hover:bg-gray-100">Contact</a>
          </div>
        </div>
      )}
    </nav>
  );
}

function Hero() {
  return (
    <section className="bg-primary text-white py-20">
      <div className="max-w-3xl mx-auto text-center px-4">
        <h1 className="text-4xl md:text-5xl font-bold mb-4">AI Agents & Linux Ops, Done Right</h1>
        <p className="mb-6 text-lg">
          Empowering small‑to‑mid businesses with intelligent automation and rock‑solid Ubuntu infrastructure.
        </p>
        <a href="#contact" className="inline-block bg-secondary hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition">
          Apply Now
        </a>
      </div>
    </section>
  );
}

function About() {
  return (
    <section id="about" className="py-16 px-4">
      <div className="max-w-5xl mx-auto grid md:grid-cols-2 gap-8 items-center">
        <div>
          <h2 className="text-3xl font-bold text-primary mb-4">Who We Are</h2>
          <p className="mb-4">
            Stratirus, a Tennetech company based in Franklin, TN, is a boutique AI and Microsoft 365 consultancy.
            We design AI agents, automate workflows, and keep the underlying Linux servers humming.
          </p>
          <p>
            Our clients range from local retailers to regional manufacturers – anyone who wants smarter tools without the overhead.
          </p>
        </div>
        <img src="https://images.unsplash.com/photo-1581091012184-7e0c2d7c6c2d?auto=format&fit=crop&w=800&q=60" alt="Team working" className="rounded-lg shadow-lg"/>
      </div>
    </section>
  );
}

function Services() {
  const [tab, setTab] = useState('ai');
  return (
    <section id="services" className="bg-gray-100 py-16 px-4">
      <div className="max-w-5xl mx-auto">
        <h2 className="text-3xl font-bold text-center text-primary mb-8">What We Do</h2>
        <div className="flex justify-center mb-6">
          <button
            className={`px-4 py-2 mx-2 rounded-t-lg ${tab === 'ai' ? 'bg-white shadow' : 'bg-gray-200'}`}
            onClick={() => setTab('ai')}
          >AI Development</button>
          <button
            className={`px-4 py-2 mx-2 rounded-t-lg ${tab === 'linux' ? 'bg-white shadow' : 'bg-gray-200'}`}
            onClick={() => setTab('linux')}
          >Linux Administration</button>
        </div>
        {tab === 'ai' && (
          <div className="bg-white p-6 rounded-b-lg shadow">
            <ul className="list-disc list-inside space-y-2">
              <li>Custom AI agents (Claude Code, Copilot Studio, Gemini)</li>
              <li>Power Automate & Microsoft 365 integration</li>
              <li>Read‑only MCP tooling for monitoring</li>
              <li>AI‑first development workflow with continuous validation</li>
            </ul>
          </div>
        )}
        {tab === 'linux' && (
          <div className="bg-white p-6 rounded-b-lg shadow">
            <ul className="list-disc list-inside space-y-2">
              <li>Ubuntu server hardening, patching & backups</li>
              <li>Docker orchestration & systemd service design</li>
              <li>Monitoring, alerting, and automated remediation scripts</li>
              <li>Performance tuning and disk‑usage management</li>
            </ul>
          </div>
        )}
      </div>
    </section>
  );
}

function Challenge() {
  return (
    <section id="challenge" className="py-16 px-4">
      <div className="max-w-4xl mx-auto">
        <h2 className="text-3xl font-bold text-primary mb-4">The Ops‑Agent Challenge</h2>
        <p className="mb-4">
          Fix a broken Ubuntu box, write a self‑healing script, and build a read‑only MCP tool so an AI agent can check on it.
          60‑90 minutes, unpaid, no LeetCode. Show us how you think.
        </p>
        <a href="https://github.com/Stratirus/ops-agent-challenge" target="_blank" rel="noopener" className="inline-block bg-secondary hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">
          View Challenge on GitHub
        </a>
      </div>
    </section>
  );
}

function Contact() {
  const [sent, setSent] = useState(false);
  const [form, setForm] = useState({ name: '', email: '', message: '' });

  const handleChange = e => setForm({ ...form, [e.target.name]: e.target.value });

  const handleSubmit = e => {
    e.preventDefault();
    // In a real site you would send the data to a server
    setSent(true);
  };

  return (
    <section id="contact" className="bg-primary text-white py-20">
      <div className="max-w-lg mx-auto px-4">
        <h2 className="text-3xl font-bold mb-6 text-center">Get In Touch</h2>
        {sent ? (
          <div className="bg-white text-primary p-6 rounded-lg text-center">
            <p className="font-semibold">Thank you! Your message has been sent.</p>
          </div>
        ) : (
          <form onSubmit={handleSubmit} className="space-y-4">
            <input
              type="text"
              name="name"
              placeholder="Your name"
              required
              value={form.name}
              onChange={handleChange}
              className="w-full p-2 rounded bg-white text-gray-800"
            />
            <input
              type="email"
              name="email"
              placeholder="Email address"
              required
              value={form.email}
              onChange={handleChange}
              className="w-full p-2 rounded bg-white text-gray-800"
            />
            <textarea
              name="message"
              placeholder="Brief message (e.g., interest in the role)"
              required
              rows="4"
              value={form.message}
              onChange={handleChange}
              className="w-full p-2 rounded bg-white text-gray-800"
            />
            <button type="submit" className="w-full bg-secondary hover:bg-blue-600 text-white font-semibold py-2 rounded">
              Send
            </button>
          </form>
        )}
        <p className="mt-6 text-center text-sm">
          Or email directly: <a href="mailto:hiring@stratirus.com" className="underline">hiring@stratirus.com</a>
        </p>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="bg-gray-800 text-gray-200 py-6">
      <div className="max-w-5xl mx-auto px-4 text-center">
        <p>&copy; {new Date().getFullYear()} Stratirus. All rights reserved.</p>
        <p className="text-sm">Prototype by Shubh Mehta (Dev)</p>
      </div>
    </footer>
  );
}

function App() {
  return (
    <>
      <Navbar />
      <Hero />
      <About />
      <Services />
      <Challenge />
      <Contact />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
