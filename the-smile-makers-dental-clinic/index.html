<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Smile Makers Dental Clinic – Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (with custom font) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif']
          },
          colors: {
            primary: '#0d6efd',
            secondary: '#6c757d'
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">

    const { useState } = React;

    const doctors = [
      { name: "Dr. Mohit Bodhwani", spec: "Endodontist", img: "https://images.unsplash.com/photo-1582719478250-2c1e8b8b9c4c?auto=format&fit=crop&w=400&q=80" },
      { name: "Dr. Shaili Shah Bodhwani", spec: "Orthodontist", img: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=400&q=80" },
      { name: "Dr. Manoj Bodhwani", spec: "Prosthodontist", img: "https://images.unsplash.com/photo-1550831107-1553da8c8464?auto=format&fit=crop&w=400&q=80" },
      { name: "Dr. Pooja Kukreja", spec: "Dental Surgeon", img: "https://images.unsplash.com/photo-1526256262350-7da7584cf5ea?auto=format&fit=crop&w=400&q=80" },
    ];

    const services = [
      { id: 1, cat: "Root Canal", title: "Root Canal Treatment", desc: "Microscopic, painless & single‑visit where possible.", price: "₹2,500 – ₹4,500", img: "https://images.unsplash.com/photo-1588776814546-1c6b9c0c8a5c?auto=format&fit=crop&w=400&q=80" },
      { id: 2, cat: "Orthodontics", title: "Teeth Braces & Invisalign", desc: "Clear aligners & metal braces for all ages.", price: "₹30,000 – ₹80,000", img: "https://images.unsplash.com/photo-1588776814546-1c6b9c0c8a5c?auto=format&fit=crop&w=400&q=80" },
      { id: 3, cat: "Implants", title: "Dental Implants", desc: "Titanium implants with same‑day crown option.", price: "₹25,000 – ₹45,000 per tooth", img: "https://images.unsplash.com/photo-1605296867304-46d5462a1a28?auto=format&fit=crop&w=400&q=80" },
      { id: 4, cat: "General", title: "Teeth Whitening", desc: "Zoom & in‑office bleaching – instant sparkle.", price: "₹3,500 – ₹6,000", img: "https://images.unsplash.com/photo-1588776814546-1c6b9c0c8a5c?auto=format&fit=crop&w=400&q=80" },
      { id: 5, cat: "General", title: "Teeth Fillings", desc: "Composite colour‑matched fillings.", price: "₹800 – ₹2,000", img: "https://images.unsplash.com/photo-1588776814546-1c6b9c0c8a5c?auto=format&fit=crop&w=400&q=80" },
    ];

    const testimonials = [
      { name: "Shaonlee Bhattacharjee", text: "Clinic staff was very warm and had all the latest technology and equipment.", rating: 5 },
      { name: "Sonal Shetty", text: "Extremely happy with the care and comfort provided.", rating: 5 },
      { name: "Rohan Mehta", text: "My kids love coming here – painless and friendly!", rating: 5 },
    ];

    const Nav = () => (
      <nav className="sticky top-0 bg-white shadow-sm z-10">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <a href="#" className="text-2xl font-bold text-primary">The Smile Makers</a>
          <div className="hidden md:flex space-x-6">
            <a href="#about" className="hover:text-primary">About Us</a>
            <a href="#services" className="hover:text-primary">Treatments</a>
            <a href="#testimonials" className="hover:text-primary">Testimonials</a>
            <a href="#contact" className="hover:text-primary">Contact</a>
          </div>
          <button className="md:hidden" onClick={() => {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
          }}>
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
        <div id="mobile-menu" className="md:hidden hidden bg-white px-4 pb-4">
          <a href="#about" className="block py-2 hover:text-primary">About Us</a>
          <a href="#services" className="block py-2 hover:text-primary">Treatments</a>
          <a href="#testimonials" className="block py-2 hover:text-primary">Testimonials</a>
          <a href="#contact" className="block py-2 hover:text-primary">Contact</a>
        </div>
      </nav>
    );

    const Hero = ({ onBook }) => (
      <section className="bg-primary text-white py-20">
        <div className="max-w-4xl mx-auto text-center px-4">
          <h1 className="text-4xl md:text-5xl font-bold mb-4">The Smile Makers Dental Clinic</h1>
          <p className="text-xl md:text-2xl mb-6">Root canal, Invisalign & General Dentistry in Khar West</p>
          <button onClick={onBook}
            className="bg-white text-primary font-semibold py-3 px-6 rounded-full hover:bg-gray-100 transition">
            Book an Appointment
          </button>
          <p className="mt-6 flex items-center justify-center space-x-2">
            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 5a2 2 0 012-2h2a2 2 0 012 2v1h4V5a2 2 0 012-2h2a2 2 0 012 2v10a2 2 0 01-2 2h-2a2 2 0 01-2-2v-1H8v1a2 2 0 01-2 2H4a2 2 0 01-2-2V5z"/></svg>
            <span className="font-medium">+91 98190 39311</span>
          </p>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-16 bg-gray-100">
        <div className="max-w-6xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center mb-8">Meet Our Team</h2>
          <div className="grid gap-8 md:grid-cols-2 lg:grid-cols-4">
            {doctors.map((doc, i) => (
              <div key={i} className="bg-white rounded-xl shadow-sm p-4 text-center">
                <img src={doc.img} alt={doc.name} className="w-24 h-24 rounded-full mx-auto mb-4 object-cover"/>
                <h3 className="text-xl font-semibold">{doc.name}</h3>
                <p className="text-secondary">{doc.spec}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Services = () => {
      const categories = ["All", "Root Canal", "Orthodontics", "Implants", "General"];
      const [active, setActive] = useState("All");

      const filtered = services.filter(s => active === "All" || s.cat === active);

      return (
        <section id="services" className="py-20">
          <div className="max-w-6xl mx-auto px-4">
            <h2 className="text-3xl font-bold text-center mb-8">Our Treatments</h2>

            <div className="flex justify-center space-x-4 mb-8 overflow-x-auto">
              {categories.map(cat => (
                <button key={cat}
                  className={`px-4 py-2 rounded-full border ${active===cat ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-gray-300'} hover:bg-primary hover:text-white transition`}
                  onClick={() => setActive(cat)}>
                  {cat}
                </button>
              ))}
            </div>

            <div className="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
              {filtered.map(s => (
                <div key={s.id} className="bg-white rounded-xl shadow hover:shadow-lg transition p-4 flex flex-col">
                  <img src={s.img} alt={s.title} className="h-40 w-full object-cover rounded-md mb-4"/>
                  <h3 className="text-xl font-semibold mb-2">{s.title}</h3>
                  <p className="flex-1 text-sm text-gray-600 mb-2">{s.desc}</p>
                  <p className="font-medium text-primary mb-2">{s.price}</p>
                  <button className="mt-auto bg-primary text-white py-2 rounded-md hover:bg-blue-700 transition">
                    Learn More
                  </button>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Testimonials = () => (
      <section id="testimonials" className="py-16 bg-gray-100">
        <div className="max-w-4xl mx-auto px-4">
          <h2 className="text-3xl font-bold text-center mb-8">What Our Patients Say</h2>
          <div className="space-y-6">
            {testimonials.map((t, i) => (
              <div key={i} className="bg-white rounded-xl shadow p-6">
                <p className="italic mb-4">"{t.text}"</p>
                <div className="flex items-center justify-between">
                  <span className="font-semibold">{t.name}</span>
                  <div className="flex space-x-1">
                    {[...Array(5)].map((_, idx) => (
                      <svg key={idx} className={`w-5 h-5 ${idx < t.rating ? 'text-primary' : 'text-gray-300'}`} fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.165c.969 0 1.371 1.24.588 1.81l-3.37 2.453a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118L10 15.347l-3.374 2.453c-.784.57-1.838-.197-1.539-1.118l1.286-3.957a1 1 0 00-.364-1.118L2.64 9.384c-.783-.57-.38-1.81.588-1.81h4.165a1 1 0 00.951-.69l1.286-3.957z"/>
                      </svg>
                    ))}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Contact = ({ onBook }) => {
      const [form, setForm] = useState({ name: '', phone: '', date: '' });
      const [submitted, setSubmitted] = useState(false);

      const handleChange = e => {
        const { name, value } = e.target;
        setForm(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = e => {
        e.preventDefault();
        setSubmitted(true);
        // In a real site you would POST the data.
        setTimeout(() => setSubmitted(false), 3000);
      };

      return (
        <section id="contact" className="py-20 bg-white">
          <div className="max-w-5xl mx-auto px-4">
            <h2 className="text-3xl font-bold text-center mb-8">Get In Touch</h2>
            <div className="grid md:grid-cols-2 gap-8">
              <div className="space-y-4">
                <p><strong>Address:</strong> 33rd Road, Linking Road Shopping area, Khar, Mumbai</p>
                <p><strong>Phone:</strong> +91 98190 39311</p>
                <p><strong>Email:</strong> info@thesmilemakersdental.com</p>
                <p><strong>Hours:</strong> Mon‑Sat 9am‑7pm</p>
              </div>

              <form onSubmit={handleSubmit} className="bg-gray-50 p-6 rounded-xl shadow-sm">
                <h3 className="text-xl font-semibold mb-4">Book an Appointment</h3>
                <div className="mb-4">
                  <label className="block text-sm font-medium mb-1">Name</label>
                  <input type="text" name="name" required value={form.name} onChange={handleChange}
                    className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div className="mb-4">
                  <label className="block text-sm font-medium mb-1">Phone</label>
                  <input type="tel" name="phone" required value={form.phone} onChange={handleChange}
                    className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div className="mb-4">
                  <label className="block text-sm font-medium mb-1">Preferred Date</label>
                  <input type="date" name="date" required value={form.date} onChange={handleChange}
                    className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <button type="submit"
                  className="w-full bg-primary text-white py-2 rounded-md hover:bg-blue-700 transition">
                  {submitted ? 'Sending...' : 'Confirm Booking'}
                </button>
                {submitted && (
                  <p className="mt-4 text-green-600 font-medium text-center">
                    🎉 Your request has been received! We'll call you shortly.
                  </p>
                )}
              </form>
            </div>
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-gray-800 text-gray-200 py-6">
        <div className="max-w-6xl mx-auto px-4 text-center text-sm">
          © {new Date().getFullYear()} The Smile Makers Dental Clinic. All rights reserved.<br/>
          Prototype by <a href="https://github.com/shubhmehta" className="underline hover:text-white">Shubh Mehta (Dev)</a>
        </div>
      </footer>
    );

    const App = () => {
      const [showBooking, setShowBooking] = useState(false);

      return (
        <>
          <Nav />
          <Hero onBook={() => setShowBooking(true)} />
          <About />
          <Services />
          <Testimonials />
          <Contact onBook={() => setShowBooking(true)} />
          <Footer />

          {/* Optional modal for quick booking */}
          {showBooking && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20">
              <div className="bg-white rounded-xl shadow-lg max-w-md w-full p-6 relative">
                <button onClick={() => setShowBooking(false)}
                  className="absolute top-2 right-2 text-gray-500 hover:text-gray-800">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                      d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
                <h3 className="text-xl font-semibold mb-4 text-center">Quick Booking</h3>
                <form onSubmit={(e) => { e.preventDefault(); setShowBooking(false); alert('Booking request sent!'); }}>
                  <div className="mb-3">
                    <input type="text" placeholder="Your Name" required
                      className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
                  </div>
                  <div className="mb-3">
                    <input type="tel" placeholder="Phone Number" required
                      className="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"/>
                  </div>
                  <button type="submit"
                    className="w-full bg-primary text-white py-2 rounded-md hover:bg-blue-700 transition">
                    Send Request
                  </button>
                </form>
              </div>
            </div>
          )}
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
