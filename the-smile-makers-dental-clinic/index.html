<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Smile Makers Dental Clinic – Modern Redesign Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN (with custom config) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0EA5E9',      /* teal-500 */
            secondary: '#0284C7',    /* teal-600 */
            accent: '#F59E0B',       /* amber-500 */
            dark: '#1F2937',         /* gray-800 */
            bg: '#F9FAFB'            /* gray-50 */
          },
          fontFamily: {
            display: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: var(--tw-font-body); }
  </style>
</head>
<body class="bg-bg text-dark">

  <!-- ===== React & Babel ===== -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Nav = ({ open, setOpen }) => (
      <nav className="fixed inset-x-0 top-0 z-50 bg-white/80 backdrop-blur-sm shadow-sm">
        <div className="max-w-7xl mx-auto flex items-center justify-between p-4">
          <a href="#home" className="text-2xl font-display text-primary">Smile Makers</a>
          <button
            className="md:hidden text-dark"
            onClick={() => setOpen(!open)}
            aria-label="Toggle menu"
          >
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              {open ? (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              ) : (
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8h16M4 16h16" />
              )}
            </svg>
          </button>
          <ul className={`md:flex space-x-6 text-base font-medium ${open ? 'block' : 'hidden'} mt-4 md:mt-0`}>
            <li><a href="#about" className="hover:text-primary transition">About</a></li>
            <li><a href="#doctors" className="hover:text-primary transition">Doctors</a></li>
            <li><a href="#services" className="hover:text-primary transition">Treatments</a></li>
            <li><a href="#testimonials" className="hover:text-primary transition">Testimonials</a></li>
            <li><a href="#contact" className="hover:text-primary transition">Contact</a></li>
          </ul>
        </div>
      </nav>
    );

    const Hero = () => (
      <section id="home" className="pt-20 bg-gradient-to-r from-primary to-secondary text-white min-h-[70vh] flex items-center">
        <div className="max-w-4xl mx-auto text-center px-4">
          <h1 className="text-4xl md:text-5xl font-display mb-4">Root Canal • Invisalign • Family Dentistry</h1>
          <p className="text-lg md:text-xl mb-6">
            Expert dental care in Khar West, Mumbai – from endodontics to orthodontics, implants to smile design.
          </p>
          <a href="#contact" className="inline-block bg-accent hover:bg-accent/90 text-white font-medium py-3 px-6 rounded-md transition">
            Book an Appointment
          </a>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-16 bg-white">
        <div className="max-w-5xl mx-auto px-4">
          <h2 className="text-3xl font-display text-primary mb-6 text-center">About The Smile Makers</h2>
          <p className="text-lg text-gray-700 leading-relaxed">
            The Smile Makers Dental Clinic, located on 33rd Road, Linking Road Shopping area, Khar, offers a full spectrum of
            dental services. Our team – Dr. Mohit Bodhwani (Endodontist), Dr. Shaili Shah Bodhwani (Orthodontist), Dr. Manoj
            Bodhwani (Prosthodontist) and Dr. Pooja Kukreja (Dental Surgeon) – combines 40+ years of collective experience
            with state‑of‑the‑art technology to give you a confident, healthy smile.
          </p>
        </div>
      </section>
    );

    const doctors = [
      {
        name: "Dr. Mohit Bodhwani",
        specialty: "Endodontist – Root Canal Specialist",
        exp: "16+ years | 25,000+ root canals",
        img: "https://via.placeholder.com/300x300?text=Mohit"
      },
      {
        name: "Dr. Shaili Shah Bodhwani",
        specialty: "Orthodontist – Braces & Invisalign",
        exp: "12+ years | 5,000+ cases",
        img: "https://via.placeholder.com/300x300?text=Shaili"
      },
      {
        name: "Dr. Manoj Bodhwani",
        specialty: "Prosthodontist – Implants & Bridges",
        exp: "14+ years | 3,200+ implants",
        img: "https://via.placeholder.com/300x300?text=Manoj"
      },
      {
        name: "Dr. Pooja Kukreja",
        specialty: "Dental Surgeon – General Dentistry",
        exp: "10+ years | 8,000+ procedures",
        img: "https://via.placeholder.com/300x300?text=Pooja"
      }
    ];

    const Doctors = () => (
      <section id="doctors" className="py-16 bg-bg">
        <div className="max-w-7xl mx-auto px-4">
          <h2 className="text-3xl font-display text-primary mb-8 text-center">Our Expert Team</h2>
          <div className="grid gap-8 md:grid-cols-2 lg:grid-cols-4">
            {doctors.map((doc, i) => (
              <div key={i} className="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition">
                <img src={doc.img} alt={doc.name} className="w-full h-48 object-cover"/>
                <div className="p-4">
                  <h3 className="font-display text-xl text-dark">{doc.name}</h3>
                  <p className="text-sm text-gray-600">{doc.specialty}</p>
                  <p className="text-xs text-gray-500 mt-2">{doc.exp}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const services = [
      {title:"Root Canal Treatment", desc:"Microscopic endodontics, retreatment, smile rehabilitation.", icon:"🦷"},
      {title:"Teeth Whitening", desc:"Professional in‑office and at‑home whitening kits.", icon:"✨"},
      {title:"Dental Implants", desc:"Surgical placement & prosthetic restoration for permanent solutions.", icon:"🔩"},
      {title:"Clear Aligners", desc:"Invisible orthodontic treatment for all ages.", icon:"🪥"},
      {title:"Dental Bridges", desc:"Fixed prosthesis to replace missing teeth.", icon:"🌉"},
      {title:"Gum Surgeries", desc:"Periodontal therapy & corrective procedures.", icon:"🌿"},
      {title:"Teeth Braces", desc:"Traditional braces with modern bonding techniques.", icon:"🦷"},
      {title:"Dentures", desc:"Custom removable prosthetics for comfort and function.", icon:"👄"}
    ];

    const Services = () => (
      <section id="services" className="py-16 bg-white">
        <div className="max-w-6xl mx-auto px-4">
          <h2 className="text-3xl font-display text-primary mb-8 text-center">Treatments We Offer</h2>
          <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
            {services.map((s, i) => (
              <div key={i} className="p-4 bg-bg rounded-xl shadow-sm hover:shadow-md transition text-center">
                <div className="text-4xl mb-2">{s.icon}</div>
                <h3 className="font-display text-lg text-dark">{s.title}</h3>
                <p className="text-sm text-gray-600 mt-1">{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const testimonials = [
      {name:"Shaonlee Bhattacharjee", rating:5, text:"Clinic staff was very warm and had all the latest technology and equipment."},
      {name:"Sonal Shetty", rating:5, text:"Extremely happy with the care and comfort provided."},
      {name:"Rohit Patel", rating:5, text:"My kids love coming here – painless and friendly!"},
    ];

    const Testimonials = () => (
      <section id="testimonials" className="py-16 bg-bg">
        <div className="max-w-4xl mx-auto px-4">
          <h2 className="text-3xl font-display text-primary mb-8 text-center">What Our Patients Say</h2>
          <div className="space-y-6">
            {testimonials.map((t, i) => (
              <div key={i} className="bg-white p-6 rounded-xl shadow-sm">
                <p className="italic text-gray-800 mb-4">"{t.text}"</p>
                <div className="flex items-center">
                  <span className="font-medium text-dark mr-2">{t.name}</span>
                  <span className="text-yellow-400">{'★'.repeat(t.rating)}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Contact = () => {
      const [form, setForm] = useState({name:"", phone:"", email:"", date:"", message:""});
      const [sent, setSent] = useState(false);

      const handleChange = e => {
        const {name, value} = e.target;
        setForm(prev => ({...prev, [name]: value}));
      };

      const handleSubmit = e => {
        e.preventDefault();
        // In a real app you would post to an API.
        setSent(true);
        setTimeout(() => setSent(false), 4000);
        setForm({name:"", phone:"", email:"", date:"", message:""});
      };

      return (
        <section id="contact" className="py-16 bg-white">
          <div className="max-w-5xl mx-auto px-4">
            <h2 className="text-3xl font-display text-primary mb-8 text-center">Book an Appointment</h2>
            <div className="flex flex-col md:flex-row md:space-x-8">
              <div className="md:w-1/2 mb-8 md:mb-0">
                <p className="text-lg text-gray-700 mb-4"><strong>Address:</strong> 33rd Road, Linking Road Shopping Area, Khar, Mumbai</p>
                <p className="text-lg text-gray-700 mb-4"><strong>Phone:</strong> <a href="tel:+919819039311" className="text-primary hover:underline">+91 98190 39311</a></p>
                <p className="text-lg text-gray-700"><strong>Email:</strong> <a href="mailto:info@thesmilemakersdental.com" className="text-primary hover:underline">info@thesmilemakersdental.com</a></p>
                <iframe
                  className="w-full h-64 rounded-xl mt-6"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3769.123456789!2d72.825123!3d19.123456!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c123456789ab%3A0xabcdef1234567890!2s33rd%20Road%2C%20Linking%20Road%20Shopping%20area%2C%20Khar%2C%20Mumbai!5e0!3m2!1sen!2sin!4v1700000000000"
                  allowFullScreen=""
                  loading="lazy"
                ></iframe>
              </div>
              <div className="md:w-1/2">
                {sent && (
                  <div className="bg-green-100 text-green-800 p-4 rounded mb-4">
                    Thank you! Your request has been received.
                  </div>
                )}
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required
                    value={form.name}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                  />
                  <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required
                    value={form.phone}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                  />
                  <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                    value={form.email}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                  />
                  <input
                    type="date"
                    name="date"
                    required
                    value={form.date}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                  />
                  <textarea
                    name="message"
                    placeholder="Brief message (optional)"
                    rows="3"
                    value={form.message}
                    onChange={handleChange}
                    className="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                  ></textarea>
                  <button
                    type="submit"
                    className="w-full bg-primary hover:bg-secondary text-white font-medium py-2 rounded transition"
                  >
                    Send Request
                  </button>
                </form>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-dark text-white py-6">
        <div className="max-w-5xl mx-auto px-4 text-center">
          <p className="mb-2">&copy; {new Date().getFullYear()} The Smile Makers Dental Clinic. All rights reserved.</p>
          <p className="text-sm">Prototype by <a href="https://github.com/shubhmehta" className="underline hover:text-accent">Shubh Mehta (Dev)</a></p>
        </div>
      </footer>
    );

    const App = () => {
      const [menuOpen, setMenuOpen] = useState(false);
      return (
        <>
          <Nav open={menuOpen} setOpen={setMenuOpen} />
          <main className="pt-16">
            <Hero />
            <About />
            <Doctors />
            <Services />
            <Testimonials />
            <Contact />
          </main>
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
